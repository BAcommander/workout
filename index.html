// ── Helpers ───────────────────────────────────────────────
const wVol     = w  => w.exercises.reduce((s,ex)=>s+ex.sets.reduce((s2,set)=>s2+set.reps*set.weight,0),0);
const exMax    = ex => { const ws=ex.sets.map(s=>s.weight).filter(w=>w>0); return ws.length?Math.max(...ws):0; };
const exVol    = ex => ex.sets.reduce((s,set)=>s+set.reps*set.weight,0);
const wSets    = w  => w.exercises.reduce((s,ex)=>s+ex.sets.length,0);
const cleanBin = raw=> Array.isArray(raw)?raw.filter(x=>x&&typeof x==='object'&&x.date&&Array.isArray(x.exercises)):[];

function autoLabel(ds) {
  const d=new Date(ds+'T12:00:00');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}
function parseWorkoutText(text) {
  const exercises=[], blocks=text.split(/Exercise:\s*Optional\s*\(\s*"/);
  for(let i=1;i<blocks.length;i++){
    const block=blocks[i], nameEnd=block.indexOf('"');
    if(nameEnd===-1) continue;
    const name=block.substring(0,nameEnd).trim(), sets=[];
    for(const m of block.matchAll(/- (\d+)\s+reps\s+x\s+([\d.]+)/g))
      sets.push({reps:parseInt(m[1]),weight:parseFloat(m[2])});
    if(sets.length&&name) exercises.push({name,sets});
  }
  return exercises;
}

// ── SyncBadge ─────────────────────────────────────────────

// ── BarChart ──────────────────────────────────────────────
function BarChart({data,selectedIdx,onSelect}) {
  if(!data.length) return null;
  var max=Math.max.apply(null,data.map(function(d){return d.volume;}).concat([1]));
  var vW=420,H=120,pL=48,pB=22,pT=12,pR=8,plotW=vW-pL-pR,plotH=H-pB-pT;
  var step=plotW/data.length, barW=Math.min(44,step*0.6);
  var gridLines=[0,Math.round(max*.5),max].reduce(function(acc,v){
    var y=pT+plotH-(v/max)*plotH;
    acc.push(ce('line',{key:'l'+v,x1:pL,y1:y,x2:vW-pR,y2:y,stroke:C.border,strokeWidth:0.5}));
    acc.push(ce('text',{key:'t'+v,x:pL-5,y:y+4,textAnchor:'end',fill:C.muted,fontSize:9},v>999?Math.round(v/1000)+'k':String(v)));
    return acc;
  },[]);
  var bars=data.map(function(d,i){
    var x=pL+i*step+step/2-barW/2, bH=Math.max((d.volume/max)*plotH,2), y=pT+plotH-bH;
    var sel=selectedIdx===i;
    return ce('g',{key:i,style:{cursor:'pointer'},onClick:function(){onSelect(sel?null:i);}},
      ce('rect',{x:x,y:y,width:barW,height:bH,fill:sel?C.teal:C.accent,rx:4,opacity:selectedIdx!==null&&!sel?0.45:1}),
      sel?ce('rect',{x:x-2,y:y-2,width:barW+4,height:bH+2,fill:'none',stroke:C.teal,strokeWidth:1.5,rx:5,opacity:0.6}):null,
      ce('text',{x:x+barW/2,y:H-4,textAnchor:'middle',fill:sel?C.teal:C.muted,fontSize:10,fontWeight:sel?700:400},d.label)
    );
  });
  return ce('svg',{viewBox:'0 0 '+vW+' '+H,style:{width:'100%',height:H}},gridLines,bars);
}

// ── LineChart ─────────────────────────────────────────────
function LineChart({data}) {
  if(data.length<2) return ce('div',{style:{textAlign:'center',padding:'36px 0',color:C.muted,fontSize:13}},'Add more workouts to see a trend');
  var vals=data.map(function(d){return d.value;}), max=Math.max.apply(null,vals), min=Math.min.apply(null,vals), range=max-min||1;
  var vW=420,H=180,pL=48,pB=24,pT=16,pR=16,plotW=vW-pL-pR,plotH=H-pB-pT,step=plotW/(data.length-1);
  var pts=data.map(function(d,i){return Object.assign({},d,{x:pL+i*step,y:pT+plotH-((d.value-min)/range)*plotH});});
  var pD=pts.map(function(p,i){return (i===0?'M':'L')+' '+p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' ');
  var aD=pD+' L '+pts[pts.length-1].x+' '+(pT+plotH)+' L '+pL+' '+(pT+plotH)+' Z';
  var gridLines=[min,Math.round((min+max)/2),max].reduce(function(acc,v){
    var y=pT+plotH-((v-min)/range)*plotH;
    acc.push(ce('line',{key:'gl'+v,x1:pL,y1:y,x2:vW-pR,y2:y,stroke:C.border,strokeWidth:0.5}));
    acc.push(ce('text',{key:'gt'+v,x:pL-5,y:y+4,textAnchor:'end',fill:C.muted,fontSize:9},String(v)));
    return acc;
  },[]);
  var dots=pts.reduce(function(acc,p,i){
    acc.push(ce('circle',{key:'c'+i,cx:p.x,cy:p.y,r:5,fill:C.accent}));
    acc.push(ce('text',{key:'tl'+i,x:p.x,y:H-4,textAnchor:'middle',fill:C.muted,fontSize:10},p.name));
    return acc;
  },[]);
  return ce('svg',{viewBox:'0 0 '+vW+' '+H,style:{width:'100%',height:H}},
    ce('defs',null,ce('linearGradient',{id:'lg',x1:'0',y1:'0',x2:'0',y2:'1'},
      ce('stop',{offset:'0%',stopColor:C.accent,stopOpacity:0.25}),
      ce('stop',{offset:'100%',stopColor:C.accent,stopOpacity:0}))),
    gridLines,
    ce('path',{d:aD,fill:'url(#lg)'}),
    ce('path',{d:pD,fill:'none',stroke:C.accent,strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'}),
    dots
  );
}

// ── SessionDetail ─────────────────────────────────────────

  return ce('div',{style:{background:C.card2,border:'1px solid '+C.teal+'44',borderRadius:12,padding:16,marginTop:10,animation:'slideDown .2s ease'}},
    ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}},

        ce('div',{style:{fontWeight:700,fontSize:15,color:C.teal}},workout.label),
        ce('div',{style:{fontSize:12,color:C.muted,marginTop:3}},workout.exercises.length+' exercises · '+sets+' total sets')),
      ce('div',{style:{textAlign:'right'}},
        ce('div',{style:{fontSize:20,fontWeight:700,color:C.accent}},total.toLocaleString()),
        ce('div',{style:{fontSize:10,color:C.muted}},'lbs lifted'))),
    ce('div',null,workout.exercises.map(function(ex,i){
      return ce('div',{key:i,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderTop:'1px solid '+C.border}},
        ce('span',{style:{fontSize:12,color:C.text,flex:1}},ex.name),
        ce('div',{style:{display:'flex',gap:14,alignItems:'center'}},
          ce('span',{style:{fontSize:11,color:C.muted}},ex.sets.length+' sets'),
          ce('span',{style:{fontSize:12,fontWeight:700,color:C.teal,minWidth:52,textAlign:'right'}},exMax(ex)>0?exMax(ex)+' lbs':'BW')
        ));
    }))
  );
}

// ── TrendStats ────────────────────────────────────────────
function TrendStats({workouts}) {
  if(!workouts.length) return null;
  var vols=workouts.map(wVol);
  var avgVol=Math.round(vols.reduce(function(s,v){return s+v;},0)/vols.length);
  var bestVol=Math.max.apply(null,vols);
  var bestLbl=workouts[vols.indexOf(bestVol)].label;
  var lastDelta=vols.length>=2?vols[vols.length-1]-vols[vols.length-2]:null;
  var avgEx=(workouts.reduce(function(s,w){return s+w.exercises.length;},0)/workouts.length).toFixed(1);
  var avgSets=Math.round(workouts.reduce(function(s,w){return s+wSets(w);},0)/workouts.length);
  var deltaCol=lastDelta===null?C.muted:lastDelta>0?C.teal:lastDelta<0?'#f87171':C.muted;
  var deltaStr=lastDelta===null?'—':(lastDelta>0?'+':'')+(lastDelta/1000).toFixed(1)+'k lbs';
  var deltaIcon=lastDelta===null?'':lastDelta>0?'▲ ':lastDelta<0?'▼ ':'';
  var stats=[
    ['Avg Volume',     (avgVol/1000).toFixed(1)+'k lbs',          null,     C.text],
    ['Best Session',   (bestVol/1000).toFixed(1)+'k lbs',         bestLbl,  C.text],
    ['vs Last Session',deltaIcon+deltaStr,                         null,     deltaCol],
    ['Avg Per Session',avgEx+' ex · '+avgSets+' sets',             null,     C.text],
  ];
  return ce('div',{style:{marginBottom:22}},
    ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1,marginBottom:10}},'Trends'),
    ce('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
      stats.map(function(row){
        var k=row[0],v=row[1],sub=row[2],col=row[3];
        return ce('div',{key:k,style:{background:C.card,borderRadius:10,padding:'12px 14px'}},
          ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:.5,marginBottom:5}},k),
          ce('div',{style:{fontSize:15,fontWeight:700,color:col}},v),
          sub?ce('div',{style:{fontSize:10,color:C.muted,marginTop:2}},sub):null
        );
      })
    )
  );
}

// ── WorkoutTracker ────────────────────────────────────────
function WorkoutTracker({person,onSync}) {
  var s_workouts   = useState(null),   workouts   = s_workouts[0],   setWorkouts   = s_workouts[1];
  var s_sessIdx    = useState(null),   sessionIdx = s_sessIdx[0],    setSessionIdx = s_sessIdx[1];
  var s_selected   = useState(null),   selected   = s_selected[0],   setSelected   = s_selected[1];
  var s_metric     = useState('maxWeight'), metric = s_metric[0],    setMetric     = s_metric[1];
  var s_showAdd    = useState(false),  showAdd    = s_showAdd[0],    setShowAdd    = s_showAdd[1];
  var s_addDate    = useState(''),     addDate    = s_addDate[0],    setAddDate    = s_addDate[1];
  var s_addLabel   = useState(''),     addLabel   = s_addLabel[0],   setAddLabel   = s_addLabel[1];
  var s_addText    = useState(''),     addText    = s_addText[0],    setAddText    = s_addText[1];
  var s_addError   = useState(''),     addError   = s_addError[0],   setAddError   = s_addError[1];
  var s_addOk      = useState(false),  addOk      = s_addOk[0],      setAddOk      = s_addOk[1];
  var skipSave = useRef(true);

  useEffect(function(){
    onSync('loading');
    fetchBin(person).then(function(raw){
      var clean=cleanBin(raw), seed=person==='charlie'?CHARLIE_SEED:[];
      var data=clean.length>0?clean:seed;
      skipSave.current=true; setWorkouts(data); onSync('idle');
      if(clean.length===0&&seed.length>0) saveBin(person,seed);
    }).catch(function(){
      try{ var s=localStorage.getItem('wt-'+person); setWorkouts(s?JSON.parse(s):(person==='charlie'?CHARLIE_SEED:[])); }
      catch(e){ setWorkouts(person==='charlie'?CHARLIE_SEED:[]); }
      onSync('error');
    });
  },[person]);

  useEffect(function(){
    if(workouts===null) return;
    if(skipSave.current){ skipSave.current=false; return; }
    try{ localStorage.setItem('wt-'+person,JSON.stringify(workouts)); }catch(e){}
    onSync('saving');
    saveBin(person,workouts).then(function(){onSync('saved');setTimeout(function(){onSync('idle');},2500);}).catch(function(){onSync('error');});
  },[workouts]);

  function getHist(name){
    return (workouts||[]).filter(function(w){return w.exercises.some(function(e){return e.name===name;});}).map(function(w){
      var ex=w.exercises.find(function(e){return e.name===name;});
      return {label:w.label,maxWeight:exMax(ex),volume:exVol(ex),sets:ex.sets};
    });
  }
  function getDelta(name){ var h=getHist(name); return h.length<2?null:h[h.length-1].maxWeight-h[h.length-2].maxWeight; }
  function closeAdd(){ setShowAdd(false);setAddError('');setAddOk(false); }
  function handleAdd(){
    setAddError('');setAddOk(false);
    if(!addDate||!addText.trim()){ setAddError('Date and workout text are required.'); return; }
    if(workouts.some(function(w){return w.date===addDate;})){ setAddError('A workout already exists for this date.'); return; }
    var exercises=parseWorkoutText(addText);
    if(!exercises.length){ setAddError('No exercises found — check the format matches your app export.'); return; }
    var nw={id:'w-'+addDate,date:addDate,label:addLabel||autoLabel(addDate),exercises:exercises};
    setWorkouts(function(prev){ return prev.concat([nw]).sort(function(a,b){return a.date<b.date?-1:1;}); });
    setSessionIdx(null); setAddOk(true);
    setTimeout(function(){ closeAdd();setAddDate('');setAddLabel('');setAddText('');setAddOk(false); },900);
  }
  var mProps={addDate:addDate,setAddDate:setAddDate,addLabel:addLabel,setAddLabel:setAddLabel,addText:addText,setAddText:setAddText,addError:addError,addOk:addOk,handleAdd:handleAdd,onClose:closeAdd};
  var allNames=[...new Set((workouts||[]).reduce(function(acc,w){ w.exercises.forEach(function(e){acc.push(e.name);}); return acc; },[]))].sort();

  // Loading
  if(workouts===null) return ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'60vh',color:C.muted,gap:10,fontSize:14}},
    ce('span',{style:{display:'inline-block',width:18,height:18,border:'2px solid '+C.accent,borderTopColor:'transparent',borderRadius:'50%',animation:'spin .7s linear infinite'}}),
    'Loading from cloud…');

  // Exercise detail
  if(selected){
    var hist=getHist(selected);
    var chartData=hist.map(function(h){return{name:h.label,value:metric==='maxWeight'?h.maxWeight:h.volume};});
    var best=Math.max.apply(null,hist.map(function(h){return h.maxWeight;}));
    var totalReps=hist.reduce(function(s,h){return s+h.sets.reduce(function(s2,set){return s2+set.reps;},0);},0);
    return ce('div',{style:{padding:20}},
      ce('button',{onClick:function(){setSelected(null);},style:{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:14,marginBottom:18,padding:0}},'← Back'),
      ce('h2',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,marginBottom:2}},selected),
      ce('p',{style:{color:C.muted,fontSize:13,marginBottom:20}},hist.length+' session'+(hist.length!==1?'s':'')+' logged'),
      ce('div',{style:{display:'flex',gap:10,marginBottom:20}},
        [['Best',best>0?best+' lbs':'BW'],['Sessions',hist.length],['Total Reps',totalReps]].map(function(pair){
          return ce('div',{key:pair[0],style:{flex:1,background:C.card,borderRadius:10,padding:'12px 14px'}},
            ce('div',{style:{color:C.muted,fontSize:10,textTransform:'uppercase',letterSpacing:1,marginBottom:4}},pair[0]),
            ce('div',{style:{fontSize:20,fontWeight:700,color:C.accent}},String(pair[1])));
        })),
      ce('div',{style:{background:C.card,borderRadius:12,padding:'16px 8px 12px',marginBottom:20}},
        ce('div',{style:{display:'flex',gap:8,paddingLeft:8,marginBottom:14}},
          ['maxWeight','volume'].map(function(m){
            return ce('button',{key:m,onClick:function(){setMetric(m);},
              style:{background:metric===m?C.accent:C.card2,color:metric===m?'#fff':C.muted,border:'none',borderRadius:6,padding:'6px 14px',cursor:'pointer',fontSize:12,fontWeight:700}},
              m==='maxWeight'?'Max Weight':'Volume');
          })),
        ce(LineChart,{data:chartData})),
      ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1,marginBottom:10}},'Session History'),
      hist.slice().reverse().map(function(h,i){
        return ce('div',{key:i,style:{background:C.card,borderRadius:10,padding:'14px 16px',marginBottom:8}},
          ce('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:8}},
            ce('span',{style:{fontWeight:600,fontSize:14}},h.label),
            ce('span',{style:{color:C.accent,fontWeight:700,fontSize:14}},h.maxWeight>0?h.maxWeight+' lbs':'BW')),
          ce('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
            h.sets.map(function(set,si){
              return ce('span',{key:si,style:{background:C.card2,borderRadius:6,padding:'4px 10px',fontSize:12,color:C.muted}},
                set.reps+'×'+(set.weight>0?set.weight:'BW'));
            })));
      }));
  }

  // Empty state
  if(!workouts.length) return ce('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60vh',gap:16,color:C.muted,padding:20,textAlign:'center'}},
    ce('div',{style:{fontSize:52}},'🏋️'),
    ce('div',{style:{fontSize:20,fontWeight:700,color:C.text}},'No workouts yet'),
    ce('div',{style:{fontSize:14,maxWidth:260}},'Add your first session to start tracking progressive overload'),
    ce('button',{onClick:function(){setShowAdd(true);},style:{background:C.accent,color:'#fff',border:'none',borderRadius:10,padding:'12px 24px',cursor:'pointer',fontSize:14,fontWeight:700,marginTop:8}},'+ Add First Workout'),
    showAdd?ce(AddModal,mProps):null);

  // Dashboard
  var totalLbs=workouts.reduce(function(s,w){return s+wVol(w);},0);
  var volData=workouts.map(function(w){return{label:w.label,volume:wVol(w)};});

  return ce('div',{style:{padding:20}},
    ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20}},
      ce('div',{style:{display:'flex',gap:20}},
        [['Sessions',workouts.length],['Exercises',allNames.length],['Lifted',(totalLbs/1000).toFixed(1)+'k lbs']].map(function(pair){
          return ce('div',{key:pair[0]},
            ce('div',{style:{fontSize:20,fontWeight:700}},String(pair[1])),
            ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:.5}},pair[0]));
        })),
      ce('button',{onClick:function(){setShowAdd(true);},style:{background:C.accent,color:'#fff',border:'none',borderRadius:10,padding:'10px 16px',cursor:'pointer',fontSize:13,fontWeight:700}},'+ Add')),
    ce('div',{style:{background:C.card,borderRadius:sessionIdx!==null?'12px 12px 0 0':12,padding:'16px 8px 10px'}},
      ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 8px',marginBottom:12}},
        ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1}},'Session Volume (lbs)'),
        ce('div',{style:{fontSize:11,color:sessionIdx!==null?C.teal:C.muted}},sessionIdx!==null?'Tap again to close':'Tap a bar for details')),
      ce(BarChart,{data:volData,selectedIdx:sessionIdx,onSelect:setSessionIdx})),
    sessionIdx!==null?ce('div',{style:{background:C.card,borderRadius:'0 0 12px 12px',padding:'0 8px 12px',marginBottom:16}},ce(SessionDetail,{workout:workouts[sessionIdx]})):ce('div',{style:{marginBottom:16}}),
    ce(TrendStats,{workouts:workouts}),
    ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1,marginBottom:10}},'Exercises — tap to view progression'),
    ce('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,paddingBottom:20}},
      allNames.map(function(name){
        var delta=getDelta(name), hist=getHist(name), latest=hist[hist.length-1];
        var bCol=delta===null?C.border:delta>0?C.teal:delta<0?'#f87171':C.border;
        return ce('div',{key:name,className:'ex-card',onClick:function(){setSelected(name);},
          style:{background:C.card,borderRadius:10,padding:'13px 14px',cursor:'pointer',borderLeft:'3px solid '+bCol}},
          ce('div',{style:{fontSize:12,fontWeight:600,marginBottom:8,lineHeight:1.3}},name),
          ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
            ce('span',{style:{fontSize:17,fontWeight:700,color:delta>0?C.teal:C.text}},latest.maxWeight>0?latest.maxWeight+' lbs':'BW'),
            ce('span',{style:{fontSize:12,fontWeight:600,color:delta>0?C.teal:delta<0?'#f87171':C.muted}},
              delta===null?'1 session':delta>0?'▲ '+delta:delta<0?'▼ '+Math.abs(delta):'= same')));
      })),
    showAdd?ce(AddModal,mProps):null);
}

// ── App ───────────────────────────────────────────────────
function App() {
  var s_sync   = useState('idle'),    syncStatus = s_sync[0],  setSyncStatus = s_sync[1];
  var s_picked = useState(function(){
    var c=localStorage.getItem('workout-auth-charlie')==='true';
    var j=localStorage.getItem('workout-auth-john')==='true';
    return (c&&!j)?'charlie':(j&&!c)?'john':null;
  }), picked=s_picked[0], setPicked=s_picked[1];
  var s_tab = useState(function(){
    var c=localStorage.getItem('workout-auth-charlie')==='true';
    var j=localStorage.getItem('workout-auth-john')==='true';
    return (c&&!j)?'charlie':(j&&!c)?'john':'charlie';
  }), tab=s_tab[0], setTab=s_tab[1];
  var s_auth = useState(function(){
    return {john:localStorage.getItem('workout-auth-john')==='true', charlie:localStorage.getItem('workout-auth-charlie')==='true'};
  }), auth=s_auth[0], setAuth=s_auth[1];
  var s_pinTarget = useState(null), pinTarget=s_pinTarget[0], setPinTarget=s_pinTarget[1];

  function pickUser(person){ setPicked(person); setTab(person); if(!auth[person]) setPinTarget(person); }
  function switchTab(newTab){ setTab(newTab); if(!auth[newTab]) setPinTarget(newTab); }
  function unlock(person){ setAuth(function(prev){return Object.assign({},prev,{[person]:true});}); setPinTarget(null); }
  function lock(person){
    localStorage.removeItem('workout-auth-'+person);
    setAuth(function(prev){return Object.assign({},prev,{[person]:false});});
    setPicked(null); setPinTarget(null);
  }

  if(picked===null) return ce(UserPicker,{onPick:pickUser});
  if(pinTarget) return ce(PinModal,{person:pinTarget,onSuccess:function(){unlock(pinTarget);},onBack:function(){setPicked(null);setPinTarget(null);}});

  return ce('div',{style:{background:C.bg,minHeight:'100vh',color:C.text,maxWidth:620,margin:'0 auto'}},
    ce('div',{style:{padding:'18px 20px 0',background:'linear-gradient(160deg,#161c2d 0%,#0d1117 100%)',borderBottom:'1px solid '+C.border,position:'sticky',top:0,zIndex:10}},
      ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}},
        ce('h1',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,letterSpacing:1}},
          'WORKOUT ',ce('span',{style:{color:C.accent}},'TRACKER')),
        ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
          ce(SyncBadge,{status:syncStatus}),
          ce('button',{onClick:function(){lock(tab);},style:{background:C.card2,border:'1px solid '+C.border,color:C.muted,borderRadius:8,padding:'6px 11px',cursor:'pointer',fontSize:13}},'🔒 Lock'))),
      ce('div',{style:{display:'flex',gap:4}},
        [['john','John'],['charlie','Charlie']].map(function(pair){
          var id=pair[0],label=pair[1];
          return ce('button',{key:id,onClick:function(){switchTab(id);},
            style:{background:tab===id?C.accent:'transparent',color:tab===id?'#fff':C.muted,border:'none',borderRadius:'8px 8px 0 0',padding:'9px 22px',cursor:'pointer',fontSize:14,fontWeight:700,letterSpacing:.5,display:'flex',alignItems:'center',gap:6}},
            label, !auth[id]?ce('span',{style:{fontSize:11}},'🔒'):null);
        }))),
    auth[tab]
      ?ce(WorkoutTracker,{key:tab,person:tab,onSync:setSyncStatus})
      :ce('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60vh',gap:12,color:C.muted}},
          ce('span',{style:{fontSize:32}},'🔒'),
          ce('span',{style:{fontSize:14}},'Tap the tab above to unlock'))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App,null));
</script>
</body>
</html>
