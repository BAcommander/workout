<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    input, textarea, button { font-family: inherit; }
    #root { min-height: 100vh; }
    .ex-card:hover { filter: brightness(1.15); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #2a3354; border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10';
import { useState, useEffect } from 'https://esm.sh/preact@10/hooks';
import htm from 'https://esm.sh/htm@3';
const html = htm.bind(h);

const C = {
  bg:"#0d1117", card:"#161c2d", card2:"#1e2640",
  accent:"#f04e37", teal:"#2dd4bf",
  text:"#e2e8f0", muted:"#64748b", border:"#2a3354"
};

  {
    id:"sun-apr-26", date:"2026-04-26", label:"Sun 26 Apr",
    exercises:[
      {name:"Lat Pulldown",        sets:[{reps:12,weight:43},{reps:12,weight:43},{reps:12,weight:43}]},
      {name:"Inner Thigh",         sets:[{reps:12,weight:54},{reps:10,weight:54},{reps:10,weight:54}]},
      {name:"Outer Thigh",         sets:[{reps:12,weight:61},{reps:12,weight:61},{reps:12,weight:61}]},
      {name:"Machine Bicep Curl",  sets:[{reps:12,weight:14},{reps:10,weight:16},{reps:10,weight:16}]},
      {name:"Seated Leg Curl",     sets:[{reps:12,weight:54},{reps:10,weight:56},{reps:10,weight:56}]},
      {name:"Chest Press",         sets:[{reps:12,weight:25},{reps:12,weight:25},{reps:10,weight:25}]},
      {name:"Leg Extension",       sets:[{reps:12,weight:52},{reps:10,weight:52},{reps:10,weight:52}]},
      {name:"Seated Row Machine",  sets:[{reps:12,weight:32},{reps:12,weight:32},{reps:12,weight:32}]},
      {name:"Ab Crunch Machine",   sets:[{reps:12,weight:23},{reps:12,weight:23},{reps:12,weight:23}]},
      {name:"Cable Rear Delt Fly", sets:[{reps:12,weight:15},{reps:12,weight:15},{reps:12,weight:15}]},
      {name:"Rear Bicep Curl",     sets:[{reps:12,weight:15},{reps:12,weight:20},{reps:12,weight:15}]},
      {name:"Shoulder Press",      sets:[{reps:11,weight:27},{reps:8, weight:27},{reps:10,weight:27}]},
    ]
  },
  {
    id:"tue-apr-28", date:"2026-04-28", label:"Tue 28 Apr",
    exercises:[
      {name:"Machine Bicep Curl",    sets:[{reps:12,weight:18},{reps:12,weight:18},{reps:10,weight:18}]},
      {name:"Seated Leg Curl",       sets:[{reps:12,weight:56},{reps:12,weight:56},{reps:10,weight:56}]},
      {name:"Seated Row Machine",    sets:[{reps:12,weight:34},{reps:12,weight:34},{reps:12,weight:34}]},
      {name:"Chest Press",           sets:[{reps:12,weight:25},{reps:12,weight:25},{reps:12,weight:25}]},
      {name:"Shoulder Press",        sets:[{reps:10,weight:27},{reps:10,weight:27},{reps:10,weight:27}]},
      {name:"Triceps Extension",     sets:[{reps:12,weight:21},{reps:12,weight:23},{reps:12,weight:23}]},
      {name:"Band Assisted Pull-Up", sets:[{reps:10,weight:0}, {reps:10,weight:0}, {reps:10,weight:0}]},
      {name:"Leg Extension",         sets:[{reps:12,weight:52},{reps:12,weight:52},{reps:12,weight:52}]},
      {name:"Lat Pulldown",          sets:[{reps:12,weight:43},{reps:12,weight:43},{reps:12,weight:43}]},
      {name:"Outer Thigh",           sets:[{reps:12,weight:61},{reps:12,weight:61},{reps:12,weight:61}]},
      {name:"Inner Thigh",           sets:[{reps:12,weight:54},{reps:12,weight:54},{reps:12,weight:54}]},
      {name:"Ab Crunch Machine",     sets:[{reps:12,weight:25},{reps:12,weight:25},{reps:12,weight:25}]},
      {name:"Cable Rear Delt Fly",   sets:[{reps:12,weight:15},{reps:12,weight:20},{reps:10,weight:20}]},
      {name:"Reverse Cable Curl",    sets:[{reps:12,weight:15},{reps:10,weight:20},{reps:8, weight:20}]},
    ]
  }
];

const wVol  = w  => w.exercises.reduce((s,ex) => s+ex.sets.reduce((s2,set) => s2+set.reps*set.weight,0),0);
const exMax = ex => { const ws=ex.sets.map(s=>s.weight).filter(w=>w>0); return ws.length?Math.max(...ws):0; };
const exVol = ex => ex.sets.reduce((s,set)=>s+set.reps*set.weight,0);

function autoLabel(ds) {
  const d=new Date(ds+"T12:00:00");
  return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${d.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}`;
}

function parseWorkoutText(text) {
  const exercises=[];
  const blocks=text.split(/Exercise:\s*Optional\s*\(\s*"/);
  for(let i=1;i<blocks.length;i++){
    const block=blocks[i], nameEnd=block.indexOf('"');
    if(nameEnd===-1) continue;
    const name=block.substring(0,nameEnd).trim(), sets=[];
    for(const m of block.matchAll(/- (\d+)\s+reps\s+x\s+([\d.]+)/g))
      sets.push({reps:parseInt(m[1]),weight:parseFloat(m[2])});
    if(sets.length&&name) exercises.push({name,sets});
  }
  return exercises;
}

function BarChart({data}){
  if(!data.length) return null;
  const max=Math.max(...data.map(d=>d.volume),1);
  const vW=420,H=110,pL=48,pB=22,pT=10,pR=8;
  const plotW=vW-pL-pR,plotH=H-pB-pT;
  const step=plotW/data.length,barW=Math.min(38,step*0.55);
  return html`
    <svg viewBox="0 0 ${vW} ${H}" style="width:100%;height:${H}px">
      ${[0,Math.round(max*.5),max].map(v=>{
        const y=pT+plotH-(v/max)*plotH;
        return html`
          <line key=${"l"+v} x1=${pL} y1=${y} x2=${vW-pR} y2=${y} stroke=${C.border} stroke-width="0.5"/>
          <text key=${"t"+v} x=${pL-5} y=${y+4} text-anchor="end" fill=${C.muted} font-size="9">${v>999?Math.round(v/1000)+"k":v}</text>`;
      })}
      ${data.map((d,i)=>{
        const x=pL+i*step+step/2-barW/2,bH=(d.volume/max)*plotH,y=pT+plotH-bH;
        return html`
          <rect key=${i} x=${x} y=${y} width=${barW} height=${bH} fill=${C.accent} rx="3">
            <title>${d.label}: ${d.volume.toLocaleString()} lbs</title>
          </rect>
          <text key=${"lbl"+i} x=${x+barW/2} y=${H-4} text-anchor="middle" fill=${C.muted} font-size="10">${d.label}</text>`;
      })}
    </svg>`;
}

function LineChart({data}){
  if(data.length<2) return html`<div style="text-align:center;padding:36px 0;color:${C.muted};font-size:13px">Add more workouts to see a trend line</div>`;
  const vals=data.map(d=>d.value),max=Math.max(...vals),min=Math.min(...vals),range=max-min||1;
  const vW=420,H=180,pL=48,pB=24,pT=16,pR=16,plotW=vW-pL-pR,plotH=H-pB-pT;
  const step=plotW/(data.length-1);
  const pts=data.map((d,i)=>({x:pL+i*step,y:pT+plotH-((d.value-min)/range)*plotH,...d}));
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const areaD=`${pathD} L ${pts[pts.length-1].x} ${pT+plotH} L ${pL} ${pT+plotH} Z`;
  return html`
    <svg viewBox="0 0 ${vW} ${H}" style="width:100%;height:${H}px">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color=${C.accent} stop-opacity="0.25"/>
          <stop offset="100%" stop-color=${C.accent} stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${[min,Math.round((min+max)/2),max].map(v=>{
        const y=pT+plotH-((v-min)/range)*plotH;
        return html`
          <line key=${"gl"+v} x1=${pL} y1=${y} x2=${vW-pR} y2=${y} stroke=${C.border} stroke-width="0.5"/>
          <text key=${"gt"+v} x=${pL-5} y=${y+4} text-anchor="end" fill=${C.muted} font-size="9">${v}</text>`;
      })}
      <path d=${areaD} fill="url(#lg)"/>
      <path d=${pathD} fill="none" stroke=${C.accent} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p,i)=>html`
        <circle key=${i} cx=${p.x} cy=${p.y} r="5" fill=${C.accent}>
          <title>${p.name}: ${p.value}</title>
        </circle>
        <text key=${"tl"+i} x=${p.x} y=${H-4} text-anchor="middle" fill=${C.muted} font-size="10">${p.name}</text>`)}
    </svg>`;
}

const iSt={width:"100%",background:C.card2,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"10px 12px",color:C.text,fontSize:"14px"};

function AddModal({addDate,setAddDate,addLabel,setAddLabel,addText,setAddText,addError,addOk,handleAdd,onClose}){
  return html`
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:flex-end;z-index:100"
      onClick=${e=>e.target===e.currentTarget&&onClose()}>
      <div style="background:${C.card};border-radius:20px 20px 0 0;width:100%;padding:24px;max-height:85vh;overflow-y:auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
          <h3 style="margin:0;font-size:18px;font-weight:700">Add Workout</h3>
          <button onClick=${onClose} style="background:none;border:none;color:${C.muted};cursor:pointer;font-size:22px;line-height:1">✕</button>
        </div>
        <label style="font-size:11px;color:${C.muted};display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Date</label>
        <input type="date" value=${addDate} onChange=${e=>setAddDate(e.target.value)} style=${{...iSt,marginBottom:"14px"}}/>
        <label style="font-size:11px;color:${C.muted};display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Label (optional)</label>
        <input type="text" value=${addLabel} placeholder="Auto-generated if blank" onChange=${e=>setAddLabel(e.target.value)} style=${{...iSt,marginBottom:"14px"}}/>
        <label style="font-size:11px;color:${C.muted};display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Paste workout export</label>
        <textarea placeholder="Paste the workout text from your app here…" onChange=${e=>setAddText(e.target.value)}
          style=${{...iSt,height:"150px",resize:"vertical",fontFamily:"monospace",fontSize:"12px",marginBottom:"20px"}}>${addText}</textarea>
        ${addError&&html`<div style="color:#f87171;font-size:13px;margin-bottom:12px">${addError}</div>`}
        ${addOk&&html`<div style="color:${C.teal};font-size:13px;margin-bottom:12px;font-weight:600">✓ Workout saved!</div>`}
        <button onClick=${handleAdd}
          style="width:100%;background:${C.accent};color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer">
          Parse & Save Workout
        </button>
      </div>
    </div>`;
}

function WorkoutTracker({person}){
  const KEY=`workout-tracker-v1-${person}`;
  const initial=person==="charlie"?CHARLIE_INITIAL:[];
  const [workouts,setWorkouts]=useState(()=>{
    try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):initial;}catch{return initial;}
  });
  const [selected,setSelected]=useState(null);
  const [metric,setMetric]=useState("maxWeight");
  const [showAdd,setShowAdd]=useState(false);
  const [addDate,setAddDate]=useState("");
  const [addLabel,setAddLabel]=useState("");
  const [addText,setAddText]=useState("");
  const [addError,setAddError]=useState("");
  const [addOk,setAddOk]=useState(false);

  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(workouts));}catch{}},[workouts]);

  const allNames=[...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.name)))].sort();
  const getHist=name=>workouts.filter(w=>w.exercises.some(e=>e.name===name)).map(w=>{
    const ex=w.exercises.find(e=>e.name===name);
    return{label:w.label,maxWeight:exMax(ex),volume:exVol(ex),sets:ex.sets};
  });
  const getDelta=name=>{const h=getHist(name);return h.length<2?null:h[h.length-1].maxWeight-h[h.length-2].maxWeight;};
  const closeAdd=()=>{setShowAdd(false);setAddError("");setAddOk(false);};
  const handleAdd=()=>{
    setAddError("");setAddOk(false);
    if(!addDate||!addText.trim()){setAddError("Date and workout text are required.");return;}
    if(workouts.some(w=>w.date===addDate)){setAddError("A workout already exists for this date.");return;}
    const exercises=parseWorkoutText(addText);
    if(!exercises.length){setAddError("No exercises found — check the format matches your app export.");return;}
    const nw={id:`w-${addDate}`,date:addDate,label:addLabel||autoLabel(addDate),exercises};
    setWorkouts(prev=>[...prev,nw].sort((a,b)=>a.date.localeCompare(b.date)));
    setAddOk(true);
    setTimeout(()=>{closeAdd();setAddDate("");setAddLabel("");setAddText("");setAddOk(false);},800);
  };
  const mProps={addDate,setAddDate,addLabel,setAddLabel,addText,setAddText,addError,addOk,handleAdd,onClose:closeAdd};

  if(!workouts.length) return html`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:${C.muted};padding:20px;text-align:center">
      <div style="font-size:52px">🏋️</div>
      <div style="font-size:20px;font-weight:700;color:${C.text}">No workouts yet</div>
      <div style="font-size:14px;max-width:260px">Add your first session to start tracking progressive overload</div>
      <button onClick=${()=>setShowAdd(true)}
        style="background:${C.accent};color:#fff;border:none;border-radius:10px;padding:12px 24px;cursor:pointer;font-size:14px;font-weight:700;margin-top:8px">
        + Add First Workout
      </button>
      ${showAdd&&html`<${AddModal} ...${mProps}/>`}
    </div>`;

  if(selected){
    const hist=getHist(selected);
    const chartData=hist.map(h=>({name:h.label,value:metric==="maxWeight"?h.maxWeight:h.volume}));
    const best=Math.max(...hist.map(h=>h.maxWeight));
    const totalReps=hist.reduce((s,h)=>s+h.sets.reduce((s2,set)=>s2+set.reps,0),0);
    return html`
      <div style="padding:20px">
        <button onClick=${()=>setSelected(null)} style="background:none;border:none;color:${C.muted};cursor:pointer;font-size:14px;margin-bottom:18px;padding:0">← Back</button>
        <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;margin-bottom:2px">${selected}</h2>
        <p style="color:${C.muted};font-size:13px;margin-bottom:20px">${hist.length} session${hist.length!==1?"s":""} logged</p>
        <div style="display:flex;gap:10px;margin-bottom:20px">
          ${[["Best",best>0?`${best} lbs`:"BW"],["Sessions",hist.length],["Total Reps",totalReps]].map(([k,v])=>html`
            <div key=${k} style="flex:1;background:${C.card};border-radius:10px;padding:12px 14px">
              <div style="color:${C.muted};font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">${k}</div>
              <div style="font-size:20px;font-weight:700;color:${C.accent}">${v}</div>
            </div>`)}
        </div>
        <div style="background:${C.card};border-radius:12px;padding:16px 8px 12px;margin-bottom:20px">
          <div style="display:flex;gap:8px;padding-left:8px;margin-bottom:14px">
            ${["maxWeight","volume"].map(m=>html`
              <button key=${m} onClick=${()=>setMetric(m)}
                style="background:${metric===m?C.accent:C.card2};color:${metric===m?"#fff":C.muted};border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700">
                ${m==="maxWeight"?"Max Weight":"Volume"}
              </button>`)}
          </div>
          <${LineChart} data=${chartData}/>
        </div>
        <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Session History</div>
        ${[...hist].reverse().map((h,i)=>html`
          <div key=${i} style="background:${C.card};border-radius:10px;padding:14px 16px;margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-weight:600;font-size:14px">${h.label}</span>
              <span style="color:${C.accent};font-weight:700;font-size:14px">${h.maxWeight>0?`${h.maxWeight} lbs`:"BW"}</span>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${h.sets.map((s,si)=>html`
                <span key=${si} style="background:${C.card2};border-radius:6px;padding:4px 10px;font-size:12px;color:${C.muted}">
                  ${s.reps}×${s.weight>0?s.weight:"BW"}
                </span>`)}
            </div>
          </div>`)}
      </div>`;
  }

  const totalLbs=workouts.reduce((s,w)=>s+wVol(w),0);
  const volData=workouts.map(w=>({label:w.label,volume:wVol(w)}));
  return html`
    <div style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px">
        <div style="display:flex;gap:20px">
          ${[["Sessions",workouts.length],["Exercises",allNames.length],["Lifted",`${(totalLbs/1000).toFixed(1)}k lbs`]].map(([k,v])=>html`
            <div key=${k}>
              <div style="font-size:20px;font-weight:700">${v}</div>
              <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:.5px">${k}</div>
            </div>`)}
        </div>
        <button onClick=${()=>setShowAdd(true)}
          style="background:${C.accent};color:#fff;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700">
          + Add
        </button>
      </div>
      <div style="background:${C.card};border-radius:12px;padding:16px 8px 10px;margin-bottom:24px">
        <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:1px;padding-left:8px;margin-bottom:12px">Session Volume (lbs)</div>
        <${BarChart} data=${volData}/>
      </div>
      <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Exercises — tap to view progression</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:20px">
        ${allNames.map(name=>{
          const delta=getDelta(name),hist=getHist(name),latest=hist[hist.length-1];
          const bCol=delta===null?C.border:delta>0?C.teal:delta<0?"#f87171":C.border;
          return html`
            <div key=${name} class="ex-card" onClick=${()=>setSelected(name)}
              style="background:${C.card};border-radius:10px;padding:13px 14px;cursor:pointer;border-left:3px solid ${bCol}">
              <div style="font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.3">${name}</div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:17px;font-weight:700;color:${delta>0?C.teal:C.text}">
                  ${latest.maxWeight>0?`${latest.maxWeight} lbs`:"BW"}
                </span>
                <span style="font-size:12px;font-weight:600;color:${delta>0?C.teal:delta<0?"#f87171":C.muted}">
                  ${delta===null?"1 session":delta>0?`▲ ${delta}`:delta<0?`▼ ${Math.abs(delta)}`:"= same"}
                </span>
              </div>
            </div>`;
        })}
      </div>
      ${showAdd&&html`<${AddModal} ...${mProps}/>`}
    </div>`;
}

function App(){
  const [tab,setTab]=useState("charlie");
  return html`
    <div style="background:${C.bg};min-height:100vh;color:${C.text};max-width:620px;margin:0 auto">
      <div style="padding:20px 20px 0;background:linear-gradient(160deg,#161c2d 0%,#0d1117 100%);border-bottom:1px solid ${C.border};position:sticky;top:0;z-index:10">
        <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;letter-spacing:1px;margin-bottom:14px">
          WORKOUT <span style="color:${C.accent}">TRACKER</span>
        </h1>
        <div style="display:flex;gap:4px">
          ${[["john","John"],["charlie","Charlie"]].map(([id,label])=>html`
            <button key=${id} onClick=${()=>setTab(id)}
              style="background:${tab===id?C.accent:"transparent"};color:${tab===id?"#fff":C.muted};border:none;border-radius:8px 8px 0 0;padding:9px 24px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.5px">
              ${label}
            </button>`)}
        </div>
      </div>
      <${WorkoutTracker} key=${tab} person=${tab}/>
    </div>`;
}

render(h(App,null),document.getElementById('root'));
</script>
</body>
</html>
