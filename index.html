// ── Helpers ───────────────────────────────────────────────
const wVol     = w  => w.exercises.reduce((s,ex)=>s+ex.sets.reduce((s2,set)=>s2+set.reps*set.weight,0),0);
const exMax    = ex => { const ws=ex.sets.map(s=>s.weight).filter(w=>w>0); return ws.length?Math.max(...ws):0; };
const exVol    = ex => ex.sets.reduce((s,set)=>s+set.reps*set.weight,0);
const wSets    = w  => w.exercises.reduce((s,ex)=>s+ex.sets.length,0);
// Default per-user goals (weekly targets — Apple Fitness vibe)
// Goals — PBs (lifetime PRs broken this week), Muscles Hit (distinct exercises this week),
// Volume (kg lifted this week)
const DEFAULT_GOALS = { pbs: 4, hit: 6, vol: 15000 };
// Schema is backwards-compatible:
//   v1 (legacy): [ ...workouts ]
//   v2:         { v:2, workouts:[...], goals:{pbs,hit,vol} }
function cleanBin(raw) {
  // v2 object form
  if (raw && typeof raw === 'object' && !Array.isArray(raw) && Array.isArray(raw.workouts)) {
    var ws = raw.workouts.filter(function(x){return x&&typeof x==='object'&&x.date&&Array.isArray(x.exercises);});
    var g  = (raw.goals && typeof raw.goals==='object') ? raw.goals : {};
    return {
      workouts: ws,
      goals: {
        pbs: Number(g.pbs)>0 ? Number(g.pbs) : DEFAULT_GOALS.pbs,
        hit: Number(g.hit)>0 ? Number(g.hit) : DEFAULT_GOALS.hit,
        vol: Number(g.vol)>0 ? Number(g.vol) : DEFAULT_GOALS.vol
      }
    };
  }
  // v1 legacy bare-array form
  if (Array.isArray(raw)) {
    return {
      workouts: raw.filter(function(x){return x&&typeof x==='object'&&x.date&&Array.isArray(x.exercises);}),
      goals: Object.assign({}, DEFAULT_GOALS)
    };
  }
  return { workouts: [], goals: Object.assign({}, DEFAULT_GOALS) };
}

function sessionsThisWeek(workouts) {
  var cutoff=new Date(Date.now()-7*24*60*60*1000);
  return workouts.filter(function(w){ return new Date(w.date+'T12:00:00')>=cutoff; }).length;
}
// Distinct exercises trained in the last 7 days
function hitsThisWeek(workouts) {
  var cutoff=new Date(Date.now()-7*24*60*60*1000);
  var set={};
  workouts.forEach(function(w){
    if(new Date(w.date+'T12:00:00')<cutoff) return;
    w.exercises.forEach(function(e){ set[e.name]=1; });
  });
  return Object.keys(set).length;
}
// Total kg lifted in the last 7 days
function volThisWeek(workouts) {
  var cutoff=new Date(Date.now()-7*24*60*60*1000);
  return workouts.reduce(function(s,w){
    if(new Date(w.date+'T12:00:00')<cutoff) return s;
    return s + wVol(w);
  }, 0);
}

// ── ISO-week aggregation for the 12-week history strip ──
// Returns array of {key, sessions, hits, prs, weekStart} for the most-recent N weeks
// in chronological order (oldest first), filling gaps with zeros.
function isoWeekKey(d) {
  var tmp=new Date(d); tmp.setHours(0,0,0,0);
  tmp.setDate(tmp.getDate()+4-(tmp.getDay()||7));
  var yr=tmp.getFullYear();
  var jan1=new Date(yr,0,1);
  var wk=Math.ceil((((tmp-jan1)/86400000)+1)/7);
  return yr+'-W'+(wk<10?'0':'')+wk;
}
function mondayOfIsoKey(yw) {
  var parts=yw.split('-W'), yr=parseInt(parts[0]), wk=parseInt(parts[1]);
  var jan4=new Date(yr,0,4);
  var d=new Date(jan4.getTime()+(wk-1)*7*86400000);
  d.setDate(d.getDate()-((d.getDay()||7)-1));
  d.setHours(0,0,0,0);
  return d;
}
function weeklyHistory(workouts, n) {
  n = n || 12;
  // bucket workouts by ISO week
  var bucket = {};
  var sorted = workouts.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  // pre-compute per-exercise running max so we can detect PRs in chronological order
  var runningMax = {};
  sorted.forEach(function(w){
    var dt = new Date(w.date+'T12:00:00');
    var key = isoWeekKey(dt);
    if(!bucket[key]) bucket[key] = { key:key, sessions:0, exSet:{}, prs:0, vol:0, weekStart:mondayOfIsoKey(key) };
    bucket[key].sessions++;
    bucket[key].vol += wVol(w);
    w.exercises.forEach(function(ex){
      bucket[key].exSet[ex.name]=1;
      var m = exMax(ex);
      if(m>0){
        var prev = runningMax[ex.name] || 0;
        if(prev>0 && m>prev) bucket[key].prs++;
        if(m>prev) runningMax[ex.name]=m;
      }
    });
  });
  // build a continuous tail of the last N weeks ending at the current week
  var todayKey = isoWeekKey(new Date());
  var todayMonday = mondayOfIsoKey(todayKey);  // compute once outside the loop
  var out = [];
  for(var i=n-1; i>=0; i--){
    // walk back i weeks from today
    var ws = new Date(todayMonday.getTime());
    ws.setDate(ws.getDate() - i*7);
    var k  = isoWeekKey(ws);
    var b  = bucket[k];
    out.push({
      key: k,
      weekStart: ws,
      sessions: b ? b.sessions : 0,
      hits:     b ? Object.keys(b.exSet).length : 0,
      pbs:      b ? b.prs : 0,
      vol:      b ? b.vol : 0
    });
  }
  return out;
}
function prsThisWeek(workouts) {
  var cutoff=new Date(Date.now()-7*24*60*60*1000);
  var sorted=workouts.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var prSet={};
  sorted.forEach(function(w,wIdx){
    if(new Date(w.date+'T12:00:00')<cutoff) return;
    w.exercises.forEach(function(ex){
      var sMax=exMax(ex); if(sMax===0) return;
      var prevBest=0;
      for(var i=0;i<wIdx;i++){
        var pe=sorted[i].exercises.find(function(e){return e.name===ex.name;});
        if(pe) prevBest=Math.max(prevBest,exMax(pe));
      }
      if(prevBest>0&&sMax>prevBest) prSet[ex.name]=1;
    });
  });
  return Object.keys(prSet).length;
}

function calcStreak(workouts) {
  if(!workouts.length) return 0;
  // Reuse top-level isoWeekKey and mondayOfIsoKey (no duplicate implementations)
  var weekMap={};
  workouts.forEach(function(w){
    var wk=isoWeekKey(new Date(w.date+'T12:00:00'));
    weekMap[wk]=(weekMap[wk]||0)+1;
  });
  var qualWeeks=Object.keys(weekMap).filter(function(wk){return weekMap[wk]>=2;}).sort().reverse();
  if(!qualWeeks.length) return 0;
  var now=isoWeekKey(new Date());
  var streak=0, expected=qualWeeks[0];
  function weeksBetween(a,b){
    return Math.round((mondayOfIsoKey(a)-mondayOfIsoKey(b))/(7*86400000));
  }
  if(weeksBetween(now,qualWeeks[0])>1) return 0;
  for(var i=0;i<qualWeeks.length;i++){
    if(i===0){ streak=1; expected=qualWeeks[0]; continue; }
    if(weeksBetween(expected,qualWeeks[i])===1){ streak++; expected=qualWeeks[i]; }
    else break;
  }
  return streak;
}

function getAllTimePBs(workouts) {
  var sorted=workouts.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var pbMap={};
  sorted.forEach(function(w){
    w.exercises.forEach(function(ex){
      var m=exMax(ex); if(m===0) return;
      if(!pbMap[ex.name]||m>pbMap[ex.name].weight)
        pbMap[ex.name]={weight:m,label:w.label,date:w.date};
    });
  });
  return Object.keys(pbMap).map(function(name){
    return {name:name,weight:pbMap[name].weight,label:pbMap[name].label,date:pbMap[name].date};
  }).sort(function(a,b){
    return b.date<a.date?-1:b.date>a.date?1:0;
  });
}

function autoLabel(ds) {
  var d=new Date(ds+'T12:00:00');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}
function parseWorkoutText(text) {
  var exercises=[], blocks=text.split(/Exercise:\s*Optional\s*\(\s*"/);
  for(var i=1;i<blocks.length;i++){
    var block=blocks[i], nameEnd=block.indexOf('"');
    if(nameEnd===-1) continue;
    var name=block.substring(0,nameEnd).trim(), sets=[];
    var re=/- (\d+)\s+reps\s+x\s+([\d.]+)/g, m;
    while((m=re.exec(block))!==null) sets.push({reps:parseInt(m[1]),weight:parseFloat(m[2])});
    if(sets.length&&name) exercises.push({name:name,sets:sets});
  }
  return exercises;
}

// ── JSONBin ───────────────────────────────────────────────
var bHdrs={'X-Access-Key':API_KEY};
function binUrl(p){ return 'https://api.jsonbin.io/v3/b/'+BINS[p]; }
function fetchWithTimeout(url,opts,ms){
  return new Promise(function(resolve,reject){
    var t=setTimeout(function(){reject(new Error('timeout'));},ms||7000);
    fetch(url,opts).then(function(r){clearTimeout(t);resolve(r);}).catch(function(e){clearTimeout(t);reject(e);});
  });
}
function fetchBin(p,retries){
  retries=retries===undefined?1:retries;
  return fetchWithTimeout(binUrl(p),{headers:bHdrs},8000)
    .then(function(r){if(!r.ok) throw new Error();return r.json();})
    .then(function(j){return j.record;})
    .catch(function(e){
      if(retries>0) return new Promise(function(res){setTimeout(res,2000);}).then(function(){return fetchBin(p,retries-1);});
      throw e;
    });
}
function saveBin(p,data){ return fetch(binUrl(p),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},bHdrs),body:JSON.stringify(data)}).then(function(r){ if(!r.ok) throw new Error(); }); }

function PinModal(props) {
  var s1=useState(''),  pin=s1[0],     setPin=s1[1];
  var s2=useState(''),  error=s2[0],   setError=s2[1];
  var s3=useState(true),remember=s3[0],setRemember=s3[1];
  var ref=useRef(null);

// ── LoadingScreen ─────────────────────────────────────────
function LoadingScreen(props) {
  // Simulated progress: ramps 0 → 80% over ~2s, holds there until fetch resolves
  // Cap at 80% (not 92%) so the hold looks less like a freeze
  var s=useState(0), pct=s[0], setPct=s[1];
  var s2=useState(false), slow=s2[0], setSlow=s2[1];

  useEffect(function(){
    var start=Date.now();
    var iv=setInterval(function(){
      var elapsed=Date.now()-start;
      var target=Math.min(80, Math.round(100*(1-Math.exp(-elapsed/800))));
      setPct(target);
    },60);
    // Show retry button after 8 seconds
    var slowTimer=setTimeout(function(){ setSlow(true); }, 8000);
    return function(){ clearInterval(iv); clearTimeout(slowTimer); };
  },[]);

  var R=42, CIRC=2*Math.PI*R;
  var off=CIRC*(1-pct/100);
  var person=props.person||'';
  var personLabel=person==='john'?'John':person==='charlie'?'Charlie':'';
  var statusMsg=props.statusMsg||'Connecting…';

  return ce('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60vh',gap:20,padding:20,animation:'fadeIn .3s ease'}},
    // Radial progress ring
    ce('div',{style:{position:'relative',width:120,height:120}},
      ce('svg',{viewBox:'0 0 100 100',style:{width:'100%',height:'100%'},className:'ring-svg'},
        ce('defs',null,
          ce('linearGradient',{id:'load-grad',x1:'0',y1:'0',x2:'1',y2:'1'},
            ce('stop',{offset:'0%',stopColor:C.red}),
            ce('stop',{offset:'50%',stopColor:C.orange}),
            ce('stop',{offset:'100%',stopColor:C.cyan}))),
        ce('circle',{className:'ring-bg',cx:50,cy:50,r:R,fill:'none',stroke:C.muted,strokeWidth:5}),
        ce('circle',{className:'ring-fg',style:{'--glow':'rgba(255,90,73,.5)'},cx:50,cy:50,r:R,fill:'none',stroke:'url(#load-grad)',strokeWidth:5,strokeDasharray:CIRC,strokeDashoffset:off})),
      ce('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},
        ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:30,fontWeight:800,color:C.text,letterSpacing:.5,lineHeight:1}},pct,
          ce('span',{style:{fontSize:14,color:C.muted,marginLeft:1}},'%')),
        ce('div',{style:{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:1.2,marginTop:3}},'loading'))),

    // Label + live status message
    ce('div',{style:{textAlign:'center'}},
      ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:700,color:C.text,letterSpacing:.5}},
        personLabel?'SYNCING '+personLabel.toUpperCase()+"'S DATA":'SYNCING FROM CLOUD'),
      // Live status — updates as fetch progresses
      ce('div',{style:{fontSize:12,color:C.muted,marginTop:5,minHeight:18,transition:'opacity .3s'}},statusMsg)),

    // "Taking longer than expected" + retry after 8s
    slow?ce('div',{style:{textAlign:'center',animation:'fadeIn .4s ease'}},
      ce('div',{style:{fontSize:12,color:C.textDim,marginBottom:10}},'Taking longer than expected…'),
      props.onRetry?ce('button',{onClick:props.onRetry,className:'pill-btn',style:{
        background:'linear-gradient(135deg,'+C.red+','+C.orange+')',
        color:'#fff',border:'none',borderRadius:10,
        padding:'10px 22px',cursor:'pointer',
        fontSize:13,fontWeight:700,letterSpacing:.4,
        boxShadow:'0 6px 16px -6px '+C.orange
      }},'Retry Connection'):null):null,

    // Linear progress bar with shimmer
    ce('div',{style:{width:'100%',maxWidth:280}},
      ce('div',{className:'progress-bar-bg',style:{height:6,borderRadius:3,overflow:'hidden',background:C.surface2}},
        ce('div',{style:{
          height:'100%',
          width:pct+'%',
          background:'linear-gradient(90deg,'+C.red+' 0%,'+C.orange+' 50%,'+C.cyan+' 100%)',
          borderRadius:3,
          transition:'width .25s ease',
          boxShadow:'0 0 12px '+C.orange+'80'
        }}))));
}

// ── BarChart (D3 polish — gradient fill, rounded bars, smart labels) ──
function BarChart(props) {
  var data=props.data,selectedIdx=props.selectedIdx,onSelect=props.onSelect;
  if(!data.length) return null;
  var max=Math.max.apply(null,data.map(function(d){return d.volume;}).concat([1]));
  var vW=420,H=140,pL=42,pB=26,pT=14,pR=8,plotW=vW-pL-pR,plotH=H-pB-pT;
  var step=plotW/data.length,barW=Math.min(36,step*0.62);

  // Smart label thinning: if >8 bars, show every other
  var labelEvery = data.length>10 ? 2 : 1;

  var grid=[0,Math.round(max*.5),max].reduce(function(acc,v){
    var y=pT+plotH-(v/max)*plotH;
    acc.push(ce('line',{key:'l'+v,x1:pL,y1:y,x2:vW-pR,y2:y,stroke:C.border,strokeWidth:0.5,strokeDasharray:v===0?'0':'2 3'}));
    acc.push(ce('text',{key:'t'+v,x:pL-6,y:y+3,textAnchor:'end',fill:C.muted,fontSize:9,fontWeight:600},v>999?(v/1000).toFixed(1)+'k':String(v)));
    return acc;
  },[]);

  var bars=data.map(function(d,i){
    var x=pL+i*step+step/2-barW/2,bH=Math.max((d.volume/max)*plotH,3),y=pT+plotH-bH,sel=selectedIdx===i;
    var dimmed=selectedIdx!==null&&!sel;
    var grad=sel?'url(#bar-sel)':'url(#bar-def)';
    var showLabel = i%labelEvery===0 || sel;
    return ce('g',{key:i,style:{cursor:'pointer'},onClick:function(){onSelect(sel?null:i);}},
      ce('rect',{x:x,y:y,width:barW,height:bH,fill:grad,rx:5,opacity:dimmed?0.35:1,style:{transformOrigin:(x+barW/2)+'px '+(pT+plotH)+'px',animation:'barGrow .5s cubic-bezier(.2,.7,.2,1) backwards',animationDelay:(i*40)+'ms'}}),
      sel?ce('rect',{x:x-2,y:y-3,width:barW+4,height:bH+3,fill:'none',stroke:C.cyan,strokeWidth:1.5,rx:6,opacity:0.7}):null,
      sel?ce('text',{x:x+barW/2,y:y-6,textAnchor:'middle',fill:C.cyan,fontSize:10,fontWeight:700},(d.volume/1000).toFixed(1)+'k'):null,
      showLabel?ce('text',{x:x+barW/2,y:H-6,textAnchor:'middle',fill:sel?C.cyan:C.muted,fontSize:9,fontWeight:sel?700:500},d.label.split(' ').slice(1,3).join(' ')):null);
  });

  return ce('svg',{viewBox:'0 0 '+vW+' '+H,style:{width:'100%',height:H,display:'block'}},
    ce('defs',null,
      ce('linearGradient',{id:'bar-def',x1:'0',y1:'0',x2:'0',y2:'1'},
        ce('stop',{offset:'0%',stopColor:C.green,stopOpacity:1}),
        ce('stop',{offset:'100%',stopColor:C.green,stopOpacity:0.55})),
      ce('linearGradient',{id:'bar-sel',x1:'0',y1:'0',x2:'0',y2:'1'},
        ce('stop',{offset:'0%',stopColor:C.cyan,stopOpacity:1}),
        ce('stop',{offset:'100%',stopColor:C.cyan,stopOpacity:0.55}))),
    grid,bars);
}

// ── LineChart ─────────────────────────────────────────────
function LineChart(props) {
  var data=props.data, trend=props.trend||[];
  if(data.length<2) return ce('div',{style:{textAlign:'center',padding:'36px 0',color:C.muted,fontSize:13}},'Add more workouts to see a trend');

  var allVals=data.map(function(d){return d.value;}).concat(trend.map(function(t){return t.value;}));
  var max=Math.max.apply(null,allVals), min=Math.min.apply(null,allVals), range=max-min||1;
  var vW=420,H=200,pL=42,pB=24,pT=16,pR=16,plotW=vW-pL-pR,plotH=H-pB-pT;
  var step=plotW/(data.length-1);

  function toY(v){ return pT+plotH-((v-min)/range)*plotH; }

  var pts=data.map(function(d,i){return {x:pL+i*step, y:toY(d.value), name:d.name, value:d.value};});
  var pD=pts.map(function(p,i){return (i===0?'M':'L')+' '+p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' ');
  var aD=pD+' L '+pts[pts.length-1].x+' '+(pT+plotH)+' L '+pL+' '+(pT+plotH)+' Z';

  var trendPath=null;
  if(trend.length>=3){
    var tPts=trend.map(function(t,i){return {x:pL+i*step, y:toY(t.value)};});
    var tD=tPts.map(function(p,i){return (i===0?'M':'L')+' '+p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' ');
    trendPath=ce('path',{d:tD,fill:'none',stroke:C.cyan,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',strokeDasharray:'5 4',opacity:0.9});
  }

  var grid=[min,Math.round((min+max)/2),max].reduce(function(acc,v){
    var y=toY(v);
    acc.push(ce('line',{key:'gl'+v,x1:pL,y1:y,x2:vW-pR,y2:y,stroke:C.border,strokeWidth:0.5,strokeDasharray:'2 3'}));
    acc.push(ce('text',{key:'gt'+v,x:pL-5,y:y+4,textAnchor:'end',fill:C.muted,fontSize:9,fontWeight:600},String(v)));
    return acc;
  },[]);

  var dots=pts.reduce(function(acc,p,i){
    acc.push(ce('circle',{key:'c'+i,cx:p.x,cy:p.y,r:4,fill:C.violet,stroke:C.surface,strokeWidth:1.5,filter:'drop-shadow(0 0 4px '+C.violet+'80)'}));
    acc.push(ce('text',{key:'tl'+i,x:p.x,y:H-4,textAnchor:'middle',fill:C.muted,fontSize:9,fontWeight:500},p.name.split(' ').slice(1,3).join(' ')));
    return acc;
  },[]);

  return ce('div',null,
    ce('svg',{viewBox:'0 0 '+vW+' '+H,style:{width:'100%',height:H}},
      ce('defs',null,ce('linearGradient',{id:'lg',x1:'0',y1:'0',x2:'0',y2:'1'},
        ce('stop',{offset:'0%',stopColor:C.violet,stopOpacity:0.28}),
        ce('stop',{offset:'100%',stopColor:C.violet,stopOpacity:0}))),
      grid,
      ce('path',{d:aD,fill:'url(#lg)'}),
      ce('path',{d:pD,fill:'none',stroke:C.violet,strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round',opacity:0.85}),
      trendPath,
      dots),
    trend.length>=3?ce('div',{style:{display:'flex',gap:16,justifyContent:'center',paddingTop:6,paddingBottom:4}},
      ce('div',{style:{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.textDim}},
        ce('span',{style:{display:'inline-block',width:18,height:2,background:C.violet,borderRadius:1}}),
        'Actual'),
      ce('div',{style:{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.cyan}},
        ce('span',{style:{display:'inline-block',width:18,height:2,background:C.cyan,borderRadius:1}}),
        '3-session avg')):null
  );
}

// ── TrendStats (D3 chips) ─────────────────────────────────
function TrendStats(props) {
  var workouts=props.workouts;
  if(!workouts.length) return null;
  var vols=workouts.map(wVol);
  var avgVol=Math.round(vols.reduce(function(s,v){return s+v;},0)/vols.length);
  var bestVol=Math.max.apply(null,vols);
  var bestLbl=workouts[vols.indexOf(bestVol)].label;
  var lastDelta=vols.length>=2?vols[vols.length-1]-vols[vols.length-2]:null;
  var avgEx=(workouts.reduce(function(s,w){return s+w.exercises.length;},0)/workouts.length).toFixed(1);
  var avgSets=Math.round(workouts.reduce(function(s,w){return s+wSets(w);},0)/workouts.length);
  var withDuration=workouts.filter(function(w){return w.duration&&w.duration>0;});
  var avgDur=withDuration.length?Math.round(withDuration.reduce(function(s,w){return s+w.duration;},0)/withDuration.length):null;

  var deltaUp=lastDelta!==null&&lastDelta>0;
  var deltaDown=lastDelta!==null&&lastDelta<0;
  var deltaCol=lastDelta===null?C.muted:deltaUp?C.green:deltaDown?'#f87171':C.muted;
  var deltaStr=lastDelta===null?'—':(lastDelta>0?'+':'')+(lastDelta/1000).toFixed(1)+'k';
  var deltaIcon=lastDelta===null?'':deltaUp?'▲':deltaDown?'▼':'=';

  // [label, value, sub, hue]
  var stats=[
    ['Avg Volume',     (avgVol/1000).toFixed(1)+'k', 'kg per session', C.green],
    ['Best Session',   (bestVol/1000).toFixed(1)+'k', bestLbl,          C.orange],
    ['vs Last',        deltaIcon+' '+deltaStr,        'kg vs prev',     deltaCol],
    ['Avg Per Session',avgEx+' ex',                   avgSets+' sets',  C.violet],
  ];
  if(avgDur!==null) stats.push(['Avg Duration', avgDur+' min', withDuration.length+' tracked', C.cyan]);

  return ce('div',{style:{marginBottom:24}},
    ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1.4,marginBottom:12,fontWeight:700}},'Trends'),
    ce('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
      stats.map(function(row){
        var k=row[0],v=row[1],sub=row[2],hue=row[3];
        return ce('div',{key:k,className:'chip-glow',style:{
          '--glow': hue+'40',
          background: chipBg(hue),
          border: '1px solid '+hue+'2e',
          borderRadius: 12,
          padding: '13px 15px',
          position:'relative',
          overflow:'hidden'
        }},
          ce('div',{style:{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:1,marginBottom:6,fontWeight:700}},k),
          ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:hue,letterSpacing:.3,lineHeight:1}},v),
          sub?ce('div',{style:{fontSize:10,color:C.textDim,marginTop:5}},sub):null);
      })));
}

// Apple-Fitness-style palette tokens for the rings.
// Each ring has `hue` (the dim track / lap color) and `pair` (the brighter
// gradient endpoint that shows on the active sweep arc — and on overlap laps).
const RING_PALETTE = {
  pbs:    { hue: '#ff9f0a', pair: '#ffd60a' },   // warm orange → yellow (PBs / trophy)
  hit:    { hue: '#30d158', pair: '#a3ff45' },   // Apple "Exercise" green → bright lime
  vol:    { hue: '#ff2d55', pair: '#ff6482' }    // Apple "Move" red → pink
};

// ── Build a normalized 3-ring spec used by both the hero and the history minis ──
// Outer  = PBs    (lifetime PRs broken this week, orange/trophy)
// Middle = Muscles Hit (distinct exercises this week, green/biceps)
// Inner  = Volume (kg lifted this week, red/fire)
function buildRings(pbs, hit, vol, goals) {
  var p = RING_PALETTE;
  return [
    { key:'pbs', label:'PBs',          icon:'🏆', value:pbs, target:goals.pbs, hue:p.pbs.hue, pair:p.pbs.pair, unit:'PRs',         hint:'this week', formatVal:null },
    { key:'hit', label:'MUSCLES HIT',  icon:'💪', value:hit, target:goals.hit, hue:p.hit.hue, pair:p.hit.pair, unit:'exercises',   hint:'this week', formatVal:null },
    { key:'vol', label:'VOLUME',       icon:'🔥', value:vol, target:goals.vol, hue:p.vol.hue, pair:p.vol.pair, unit:'kg',          hint:'this week', formatVal:fmtKg }
  ];
}

// 13,400 → "13.4k", 1234 → "1,234"
function fmtKg(n){
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(n));
}

// Reusable concentric-rings SVG. `interactive` makes each ring tap-target.
function ConcentricRings(props) {
  var rings = props.rings;       // [{key,hue,pair,value,target},...] outer→inner
  var size  = props.size  || 150;
  var bandW = props.bandW || 11; // stroke width
  var gap   = props.gap   || 4;  // gap between bands
  var onTap = props.onTap;       // (key) => void  (optional)
  var activeKey = props.activeKey;
  var idPrefix = props.idPrefix || 'tr';
  var cx = size/2, cy = size/2;
  // outer radius shrinks for each subsequent ring
  var rOuter = size/2 - bandW/2 - 2;
  var radii = rings.map(function(_,i){ return rOuter - i*(bandW+gap); });

  return ce('svg',{viewBox:'0 0 '+size+' '+size,style:{width:'100%',height:'100%',overflow:'visible'},className:'ring-svg'},
    ce('defs',null,
      rings.map(function(r,i){
        return ce('linearGradient',{key:i,id:idPrefix+'-'+i,x1:'0',y1:'0',x2:'1',y2:'1'},
          ce('stop',{offset:'0%',stopColor:r.hue}),
          ce('stop',{offset:'100%',stopColor:r.pair||r.hue}));
      })),
    rings.map(function(r,i){
      var rad  = radii[i];
      var raw  = r.target>0 ? r.value/r.target : 0;
      var circ = 2*Math.PI*rad;
      var isActive = onTap && activeKey===r.key;
      // Apple Fitness overflow: laps stack visually.
      // - pct < 1: base loop hidden; partial arc sweeps to pct.
      // - pct >= 1: base loop visible at full hue; overlap arc sweeps to (pct - floor(pct)).
      var laps     = Math.floor(raw);
      var fraction = raw - laps;
      // If the user is exactly at 100%/200%/etc, render full loop, no overlap arc.
      if (raw>0 && fraction===0) { laps -= 1; fraction = 1; }
      var hasBase    = laps >= 1;                 // a fully-completed lap exists
      var overlapPct = hasBase ? fraction : raw;  // arc on top of base (or alone if no base yet)
      var overlapOff = circ * (1 - overlapPct);
      // Apple's lap trick: same hue on the overlap, but a heavy inner drop-shadow
      // on the leading edge so the new lap reads as physically stacking on top.
      var baseGrad    = 'url(#'+idPrefix+'-'+i+')';   // hue → pair gradient sweep
      var overlapStroke = baseGrad;                    // SAME color family — laps read by depth, not hue swap

      return ce(React.Fragment,{key:i},
        // Hit-area: invisible thicker stroke captures taps for this band
        onTap ? ce('circle',{
          cx:cx,cy:cy,r:rad,fill:'none',
          stroke:'rgba(0,0,0,0)',
          strokeWidth:bandW+gap,
          style:{cursor:'pointer'},
          onClick:function(e){ e.stopPropagation(); onTap(r.key); }
        }) : null,
        // Dim track (always visible) — .ring-bg CSS rule sets opacity:.14
        ce('circle',{className:'ring-bg',cx:cx,cy:cy,r:rad,fill:'none',stroke:r.hue,strokeWidth:bandW,style:{pointerEvents:'none'}}),
        // Base completed loop (only when laps >= 1)
        hasBase ? ce('circle',{cx:cx,cy:cy,r:rad,fill:'none',stroke:baseGrad,strokeWidth:bandW,strokeLinecap:'round',
          style:{pointerEvents:'none', filter: isActive ? 'drop-shadow(0 0 8px '+r.hue+')' : null}}) : null,
        // Active arc — partial sweep (pct<1) OR overflow remainder (pct>1)
        overlapPct>0 ? ce('circle',{className:'ring-fg',cx:cx,cy:cy,r:rad,fill:'none',
          stroke: overlapStroke,
          strokeWidth: bandW,
          strokeDasharray: circ,
          strokeDashoffset: overlapOff,
          transform: 'rotate(-90 '+cx+' '+cy+')',
          strokeLinecap:'round',
          style:{
            '--glow':r.hue+(isActive?'cc':'70'),
            // Stronger shadow on the lap-overlap so it reads as stacked.
            filter: hasBase
              ? 'drop-shadow(0 2px 4px rgba(0,0,0,0.7)) drop-shadow(0 0 6px '+r.hue+'aa)'
              : (isActive ? 'drop-shadow(0 0 8px '+r.hue+')' : null),
            pointerEvents:'none'
          }}) : null
      );
    }));
}

// ── TripleRing — hero. Tap any ring to expand history below. ──

  return ce('div',{style:{display:'flex',alignItems:'center',gap:18}},
    ce('div',{style:{position:'relative',width:size,height:size,flexShrink:0}},

            // Label only — no "THIS WEEK" hint repeated here

              ce('span',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:19,fontWeight:800,color:hitGoal?r.hue:C.text,letterSpacing:.3,lineHeight:1}}, r.formatVal ? r.formatVal(r.value) : r.value),
              ce('span',{style:{fontSize:10,color:C.muted,fontWeight:600,whiteSpace:'nowrap'}},' / '+(r.formatVal?r.formatVal(r.target):r.target)+' '+r.unit))),
          ce('span',{style:{fontSize:11,color:isActive?r.hue:C.muted,fontWeight:700,flexShrink:0,transition:'transform .2s',display:'inline-block',transform:isActive?'rotate(180deg)':'rotate(0)'}},'⌄'));
      })));

// ── HistoryRings — 12 mini concentric-ring sets (one per ISO week) ──
// props: weeks, goals, activeKey, onSwitch(key), onClose(), workouts
function HistoryRings(props) {
  var weeks    = props.weeks;
  var goals    = props.goals;
  var onClose  = props.onClose;
  var workouts = props.workouts || [];

  // Local metric state — decoupled from parent expandedRing
  // Initialise from props.activeKey (which ring was tapped to open the panel)
  var sm = useState(props.activeKey||'pbs'); var activeKey=sm[0]; var setActiveKey=sm[1];
  var sw = useState(null); var selectedWeekKey=sw[0]; var setSelectedWeekKey=sw[1];

  var goalField  = activeKey==='pbs'?'pbs':activeKey==='hit'?'hits':'vol';
  var goalTarget = activeKey==='pbs'?goals.pbs:activeKey==='hit'?goals.hit:goals.vol;
  var totalHit   = weeks.filter(function(w){return w[goalField]>=goalTarget&&goalTarget>0;}).length;
  var activeHue  = activeKey==='pbs'?RING_PALETTE.pbs.hue:activeKey==='hit'?RING_PALETTE.hit.hue:RING_PALETTE.vol.hue;
  var activeLabel= activeKey==='pbs'?'PBs':activeKey==='hit'?'Muscles Hit':'Volume';

  var selectedSessions = selectedWeekKey ? workouts.filter(function(w){
    return isoWeekKey(new Date(w.date+'T12:00:00'))===selectedWeekKey;
  }) : [];
  var selectedWeekData = selectedWeekKey ? weeks.find(function(w){return w.key===selectedWeekKey;}) : null;

  return ce('div',{style:{
    background:'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',
    border:'1px solid '+C.border,
    borderRadius:14,padding:'16px 14px 14px',marginBottom:14,
    animation:'slideDown .25s ease'
  }},
    // Header
    ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,gap:10}},
      ce('div',{style:{minWidth:0}},
        ce('div',{style:{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:1.4,fontWeight:700}},'12-Week History'),
        ce('div',{style:{fontSize:11,color:C.textDim,marginTop:2}},
          ce('span',{style:{color:activeHue,fontWeight:700}},totalHit+' of 12'),' weeks hit ',activeLabel,' goal')),
      ce('button',{onClick:onClose,style:{background:C.surface3,border:'1px solid '+C.border,color:C.textDim,borderRadius:6,padding:'4px 9px',cursor:'pointer',fontSize:13,lineHeight:1,flexShrink:0}},'✕')),

    // 6x2 grid — each week tappable
    ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(6, 1fr)',gap:8,marginBottom:14}},
      weeks.map(function(w,i){
        var miniRings=buildRings(w.pbs,w.hits,w.vol,goals);
        miniRings.forEach(function(r){
          if(r.key!==activeKey){r.hue=r.hue+'88';r.pair=(r.pair||r.hue)+'88';}
        });
        var isCurrent=i===weeks.length-1;
        var isSelected=w.key===selectedWeekKey;
        var isEmpty=w.sessions===0;
        return ce('button',{
          key:w.key,
          onClick:function(){ if(!isEmpty) setSelectedWeekKey(isSelected?null:w.key); },
          style:{
            display:'flex',flexDirection:'column',alignItems:'center',gap:4,
            padding:'8px 4px',borderRadius:8,
            background:isSelected?activeHue+'20':isCurrent?activeHue+'10':'transparent',
            border:'1px solid '+(isSelected?activeHue+'88':isCurrent?activeHue+'40':C.border+'44'),
            cursor:isEmpty?'default':'pointer',
            transition:'background .15s,border-color .15s',
            boxShadow:isSelected?'0 0 12px -4px '+activeHue:'none',
            WebkitTapHighlightColor:'transparent'
          }},
          ce('div',{style:{width:'100%',aspectRatio:'1 / 1',position:'relative',maxWidth:54,opacity:isEmpty?0.3:1}},
            ce(ConcentricRings,{rings:miniRings,size:54,bandW:6,gap:1.5,idPrefix:'h'+i})),
          ce('div',{style:{fontSize:9,color:isSelected?activeHue:isCurrent?activeHue:C.muted,fontWeight:isSelected||isCurrent?800:600,letterSpacing:.3,lineHeight:1}},
            (w.weekStart.getMonth()+1)+'/'+w.weekStart.getDate()));
      })),

    // Week detail panel
    selectedWeekData ? ce('div',{style:{
      background:C.surface3,border:'1px solid '+activeHue+'44',borderRadius:12,
      padding:'14px',marginBottom:14,animation:'slideDown .2s ease'
    }},
      ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:selectedSessions.length?12:0}},
        ce('div',null,
          ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:800,color:activeHue,letterSpacing:.4}},
            'W/C '+( (selectedWeekData.weekStart.getMonth()+1)+'/'+selectedWeekData.weekStart.getDate() )),
          ce('div',{style:{fontSize:11,color:C.muted,marginTop:2}},
            selectedSessions.length
              ? selectedSessions.length+' session'+(selectedSessions.length!==1?'s':'')+' · '+selectedWeekData.pbs+' PRs · '+fmtKg(selectedWeekData.vol)+'kg'
              : 'No sessions logged this week')),
        ce('button',{onClick:function(){setSelectedWeekKey(null);},style:{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:13,padding:'2px 6px'}},'✕')),
      selectedSessions.map(function(sess){
        var vol=wVol(sess),sets=wSets(sess);
        return ce('div',{key:sess.id,style:{
          background:'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',
          border:'1px solid '+C.border,borderRadius:10,padding:'12px 14px',marginBottom:8
        }},
          ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
            ce('div',null,
              ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,color:C.text,letterSpacing:.3}},sess.label.toUpperCase()),
              ce('div',{style:{fontSize:11,color:C.muted,marginTop:2}},sess.exercises.length+' exercises · '+sets+' sets'+(sess.duration?' · '+sess.duration+' min':''))),
            ce('div',{style:{textAlign:'right'}},
              ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:800,color:C.green,lineHeight:1}},fmtKg(vol)),
              ce('div',{style:{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:.8,marginTop:2}},'kg'))),
          ce('div',null,sess.exercises.map(function(ex,ei){
            return ce('div',{key:ei,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderTop:'1px solid '+C.border}},
              ce('span',{style:{fontSize:12,color:C.text,flex:1}},ex.name),
              ce('div',{style:{display:'flex',gap:12,alignItems:'center'}},
                ce('span',{style:{fontSize:11,color:C.muted}},ex.sets.length+' sets'),
                ce('span',{style:{fontSize:12,fontWeight:700,color:C.cyan,fontFamily:"'Barlow Condensed',sans-serif",minWidth:48,textAlign:'right'}},
                  exMax(ex)>0?exMax(ex)+' kg':'BW')));
          })));
      })) : null,

    // Legend
    ce('div',{style:{display:'flex',justifyContent:'center',gap:10}},
      ['pbs','hit','vol'].map(function(k){
        var hue=k==='pbs'?RING_PALETTE.pbs.hue:k==='hit'?RING_PALETTE.hit.hue:RING_PALETTE.vol.hue;
        var lbl=k==='pbs'?'PBs':k==='hit'?'Muscles':'Volume';
        var on=k===activeKey;
        return ce('button',{key:k,onClick:function(){setActiveKey(k);},style:{
          display:'inline-flex',alignItems:'center',gap:6,
          background:on?hue+'22':'transparent',
          border:'1px solid '+(on?hue+'66':C.border),
          borderRadius:999,padding:'6px 12px',cursor:'pointer',
          fontSize:10,color:on?hue:C.muted,fontWeight:on?700:600,
          letterSpacing:.5,textTransform:'uppercase',
          transition:'background .15s,border-color .15s,color .15s',
          boxShadow:on?'0 0 10px -3px '+hue:'none'
        }},
          ce('span',{style:{width:8,height:8,borderRadius:'50%',background:hue,flexShrink:0,boxShadow:on?'0 0 6px '+hue:'none'}}),
          lbl);
      })));
}

// ── SettingsSheet — edit per-user weekly goals ──
function SettingsSheet(props) {
  var goals = props.goals, onSave = props.onSave, onClose = props.onClose;
  var s1=useState(String(goals.pbs)), pbs=s1[0], setPbs=s1[1];
  var s2=useState(String(goals.hit)), h=s2[0],   setH=s2[1];
  var s3=useState(String(goals.vol)), v=s3[0],   setV=s3[1];
  function save(){
    var ng = {
      pbs: Math.max(1, parseInt(pbs)||DEFAULT_GOALS.pbs),
      hit: Math.max(1, parseInt(h)  ||DEFAULT_GOALS.hit),
      vol: Math.max(1, parseInt(v)  ||DEFAULT_GOALS.vol)
    };
    onSave(ng); onClose();
  }
  function reset(){
    setPbs(String(DEFAULT_GOALS.pbs));
    setH(String(DEFAULT_GOALS.hit));
    setV(String(DEFAULT_GOALS.vol));

  var rows = [
    { key:'pbs', label:'PBs',         icon:'🏆', hue:RING_PALETTE.pbs.hue, unit:'PRs / week',         sub:'Lifetime personal records broken per week.',  val:pbs, set:setPbs, step:1    },
    { key:'h',   label:'MUSCLES HIT', icon:'💪', hue:RING_PALETTE.hit.hue, unit:'exercises / week',   sub:'How many distinct exercises to hit per week.', val:h,   set:setH,   step:1    },
    { key:'v',   label:'VOLUME',      icon:'🔥', hue:RING_PALETTE.vol.hue, unit:'kg / week',          sub:'Total weight lifted across all sets per week.',val:v,   set:setV,   step:500  }
  ];
  return ce('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.78)',backdropFilter:'blur(4px)',display:'flex',alignItems:'flex-end',zIndex:100},
    onClick:function(e){if(e.target===e.currentTarget) onClose();}},
    ce('div',{style:{background:C.surface,borderRadius:'20px 20px 0 0',padding:'22px 20px 28px',width:'100%',maxWidth:620,margin:'0 auto',maxHeight:'92vh',overflowY:'auto',border:'1px solid '+C.border,borderBottom:'none',animation:'slideUp .3s ease'}},
      ce('div',{style:{width:36,height:4,background:C.border,borderRadius:2,margin:'-6px auto 16px'}}),
      ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
        ce('h3',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:800,letterSpacing:.5,lineHeight:1.1,margin:0}},'WEEKLY GOALS'),
        ce('button',{onClick:onClose,style:{background:'transparent',border:'none',color:C.muted,fontSize:24,cursor:'pointer',padding:0,lineHeight:1}},'×')),
      ce('p',{style:{color:C.textDim,fontSize:13,marginTop:8,marginBottom:18,lineHeight:1.4}},'Tune your three rings. Changes sync across devices.'),

        return ce('div',{key:r.key,style:{

            ce('span',{style:{flex:1,textAlign:'right',fontSize:10,color:C.muted,fontWeight:600,letterSpacing:.5,textTransform:'uppercase'}},r.unit)),
          ce('div',{style:{fontSize:11.5,color:C.textDim,marginBottom:8,lineHeight:1.4}},r.sub),
          ce('div',{style:{display:'flex',alignItems:'center',gap:8}},
            ce('button',{onClick:function(){r.set(String(Math.max(r.step||1,(parseInt(r.val)||0)-(r.step||1))));},
              style:{background:C.surface3,border:'1px solid '+C.border,color:C.text,borderRadius:8,width:36,height:36,cursor:'pointer',fontSize:18,fontWeight:700}},'−'),
            ce('input',{type:'number',inputMode:'numeric',min:r.step||1,step:r.step||1,value:r.val,onChange:function(e){r.set(e.target.value);},
              style:{flex:1,background:C.surface2,border:'1px solid '+r.hue+'40',borderRadius:8,padding:'9px 12px',color:r.hue,fontSize:20,fontWeight:800,fontFamily:"'Barlow Condensed',sans-serif",textAlign:'center',outline:'none',letterSpacing:.4}}),
            ce('button',{onClick:function(){r.set(String((parseInt(r.val)||0)+(r.step||1)));},
              style:{background:C.surface3,border:'1px solid '+C.border,color:C.text,borderRadius:8,width:36,height:36,cursor:'pointer',fontSize:18,fontWeight:700}},'+')));
      }),
      ce('div',{style:{display:'flex',gap:10,marginTop:14}},
        ce('button',{onClick:reset,style:{flex:1,background:C.surface3,border:'1px solid '+C.border,color:C.textDim,borderRadius:12,padding:'13px',cursor:'pointer',fontSize:12,fontWeight:700,letterSpacing:.5}},'RESET TO DEFAULT'),
        ce('button',{onClick:save,style:{flex:2,background:'linear-gradient(135deg,'+C.red+','+C.orange+')',border:'none',color:'#fff',borderRadius:12,padding:'13px',cursor:'pointer',fontSize:13,fontWeight:800,letterSpacing:.6,boxShadow:'0 6px 16px -6px '+C.orange}},'SAVE GOALS'))));
}

// ── WorkoutTracker ────────────────────────────────────────
function WorkoutTracker(props) {
  var person=props.person,onSync=props.onSync;
  var s1 =useState(null),  workouts  =s1[0],  setWorkouts  =s1[1];
  var sg =useState(Object.assign({},DEFAULT_GOALS)), goals=sg[0], setGoals=sg[1];
  var s2 =useState(null),  sessionIdx=s2[0],  setSessionIdx=s2[1];
  var s3 =useState(null),  selected  =s3[0],  setSelected  =s3[1];
  var s4 =useState('maxWeight'),metric=s4[0],  setMetric    =s4[1];
  var s5 =useState(false), showAdd   =s5[0],  setShowAdd   =s5[1];
  var s6 =useState(''),    addDate   =s6[0],  setAddDate   =s6[1];
  var s7 =useState(''),    addLabel  =s7[0],  setAddLabel  =s7[1];
  var s8 =useState(''),    addText   =s8[0],  setAddText   =s8[1];
  var s9 =useState(''),    addDuration=s9[0], setAddDuration=s9[1];
  var s10=useState(''),    addError  =s10[0], setAddError  =s10[1];
  var s11=useState(false), addOk     =s11[0], setAddOk     =s11[1];
  var s12=useState(false), showPBs   =s12[0], setShowPBs   =s12[1];
  var s13=useState(false), showSettings=s13[0], setShowSettings=s13[1];
  var s14=useState(null), expandedRing=s14[0], setExpandedRing=s14[1];   // null | 'pbs' | 'hit' | 'vol'
  var loaded=useRef(false);
  var s_msg=useState('Connecting…'), statusMsg=s_msg[0], setStatusMsg=s_msg[1];
  var s_nf=useState(false), networkFailed=s_nf[0], setNetworkFailed=s_nf[1];

  // Listen for "open settings" from the App header
  useEffect(function(){
    function open(){ setShowSettings(true); }
    window.addEventListener('wt-open-settings', open);
    return function(){ window.removeEventListener('wt-open-settings', open); };
  },[]);

  useEffect(function(){
    loaded.current=false;
    setWorkouts(null);
    setSessionIdx(null);
    setStatusMsg('Connecting…');
    setNetworkFailed(false);
    onSync('loading');
    // Retry-aware fetch: show 'Retrying…' if first attempt fails
    var attempt = 0;
    function doFetch(){
      return fetchWithTimeout(binUrl(person),{headers:bHdrs},8000)
        .then(function(r){if(!r.ok) throw new Error();return r.json();})
        .then(function(j){return j.record;})
        .catch(function(e){
          if(attempt===0){
            attempt++;
            setStatusMsg('Retrying…');
            return new Promise(function(res){setTimeout(res,2000);}).then(doFetch);
          }
          throw e;
        });
    }
    doFetch().then(function(raw){
      var clean=cleanBin(raw), seed=person==='charlie'?CHARLIE_SEED:[];
      var ws = clean.workouts.length>0 ? clean.workouts : null;

      // Bin was empty — check localStorage before falling back to seed
      var recoveredFromLocal = false;
      if(!ws){
        try{
          var ls=localStorage.getItem('wt-'+person);
          var parsed=ls?JSON.parse(ls):null;
          var local=cleanBin(parsed);
          if(local.workouts.length>0){
            ws=local.workouts;
            recoveredFromLocal=true;
            // Push localStorage data up to bin — do this BEFORE setting state
            // so the save effect (guarded by loaded.current) doesn't race it
            saveBin(person,{v:2,workouts:ws,goals:local.goals});
          }
        } catch(e){}
      }

      // Final fallback to seed (Charlie only), or empty
      if(!ws) ws = seed.length>0 ? seed.slice() : [];

      setGoals(clean.goals);
      setWorkouts(ws);
      Promise.resolve().then(function(){ loaded.current=true; });
      onSync('idle');
      // Seed-write ONLY if bin was empty, localStorage had nothing, and seed exists.
      // Guard with recoveredFromLocal to avoid overwriting the recovery save above.
      if(clean.workouts.length===0 && seed.length>0 && !recoveredFromLocal) saveBin(person,{v:2,workouts:seed,goals:clean.goals});
    }).catch(function(){
      setNetworkFailed(true);
      setStatusMsg('Loading from cache…');
      try{
        var s=localStorage.getItem('wt-'+person);
        var parsed=s?JSON.parse(s):null;
        var local=cleanBin(parsed);
        setGoals(local.goals);
        setWorkouts(local.workouts.length>0 ? local.workouts : (person==='charlie'?CHARLIE_SEED:[]));
      }
      catch(e){ setWorkouts(person==='charlie'?CHARLIE_SEED:[]); }
      Promise.resolve().then(function(){ loaded.current=true; });
      onSync('error');
    });
  },[person, props.retryKey]);

  useEffect(function(){
    if(workouts===null) return;
    if(!loaded.current) return;   // initial load — don't echo back
    // NEVER overwrite the bin with an empty array — this was causing data loss
    // when the bin returned empty and the save effect fired before new data arrived
    if(workouts.length===0) return;
    var payload = { v:2, workouts:workouts, goals:goals };
    try{ localStorage.setItem('wt-'+person,JSON.stringify(payload)); }catch(e){}
    onSync('saving');
    saveBin(person,payload).then(function(){onSync('saved');setTimeout(function(){onSync('idle');},2500);}).catch(function(){onSync('error');});
  },[workouts, goals]);

  function getHist(name){
    return (workouts||[]).filter(function(w){return w.exercises.some(function(e){return e.name===name;});}).map(function(w){
      var ex=w.exercises.find(function(e){return e.name===name;});
      return {label:w.label,maxWeight:exMax(ex),volume:exVol(ex),sets:ex.sets};
    });
  }
  function getDelta(name){ var h=getHist(name); return h.length<2?null:h[h.length-1].maxWeight-h[h.length-2].maxWeight; }
  function isPR(name){
    var h=getHist(name); if(h.length<2) return false;
    var latest=h[h.length-1].maxWeight;
    if(latest===0) return false;
    var prevBest=Math.max.apply(null,h.slice(0,-1).map(function(x){return x.maxWeight;}));
    return latest>prevBest;
  }

  function handleDelete(w){
    var when=w.date+(w.label?' — '+w.label:'');
    if(!window.confirm('Delete this workout?\n\n'+when+'\n\nThis cannot be undone.')) return;
    setWorkouts(function(prev){ return prev.filter(function(x){return x.id!==w.id;}); });
    setSessionIdx(null);
  }

  function closeAdd(){ setShowAdd(false);setAddError('');setAddOk(false); }
  function handleAdd(){
    setAddError('');setAddOk(false);
    if(!addDate||!addText.trim()){ setAddError('Date and workout text are required.'); return; }
    if(workouts.some(function(w){return w.date===addDate;})){ setAddError('A workout already exists for this date.'); return; }
    var exercises=parseWorkoutText(addText);
    if(!exercises.length){ setAddError('No exercises found — check the format matches your app export.'); return; }
    var dur=addDuration?parseInt(addDuration):null;
    var nw={id:'w-'+addDate,date:addDate,label:addLabel||autoLabel(addDate),exercises:exercises};
    if(dur&&dur>0) nw.duration=dur;
    setWorkouts(function(prev){ return prev.concat([nw]).sort(function(a,b){return a.date<b.date?-1:1;}); });
    setSessionIdx(null); setAddOk(true);
    setTimeout(function(){ closeAdd();setAddDate('');setAddLabel('');setAddDuration('');setAddText('');setAddOk(false); },900);
  }

  var allNames=[...new Set((workouts||[]).reduce(function(acc,w){ w.exercises.forEach(function(e){acc.push(e.name);}); return acc; },[]))].sort();
  var mProps={addDate:addDate,setAddDate:setAddDate,addLabel:addLabel,setAddLabel:setAddLabel,addDuration:addDuration,setAddDuration:setAddDuration,addText:addText,setAddText:setAddText,addError:addError,addOk:addOk,handleAdd:handleAdd,onClose:closeAdd};

  // ── Loading state — new radial progress UI
  if(workouts===null) return ce(LoadingScreen,{person:person,statusMsg:statusMsg,onRetry:props.onRetry});

  // ── Exercise detail view
  if(selected){
    var hist=getHist(selected);
    var chartData=hist.map(function(h){return{name:h.label,value:metric==='maxWeight'?h.maxWeight:h.volume};});
    var best=Math.max.apply(null,hist.map(function(h){return h.maxWeight;}));
    var totalReps=hist.reduce(function(s,h){return s+h.sets.reduce(function(s2,set){return s2+set.reps;},0);},0);

    var topStats=[
      ['Best',     best>0?best+' kg':'BW', C.orange],
      ['Sessions', hist.length,             C.cyan],
      ['Total Reps', totalReps,             C.violet]
    ];

    return ce('div',{style:{padding:'0 0 20px'}},
      // Sticky back bar — hugs under main header
      ce('div',{style:{position:'sticky',top:88,zIndex:9,padding:'14px 20px 12px',background:'linear-gradient(180deg,rgba(7,9,15,.94) 0%,rgba(7,9,15,.85) 70%,rgba(7,9,15,0) 100%)',backdropFilter:'blur(8px)',WebkitBackdropFilter:'blur(8px)',marginBottom:6}},
        ce('button',{className:'back-pill',onClick:function(){setSelected(null);}},
          ce('span',{className:'arrow'},'←'),'BACK TO DASHBOARD')),
      ce('div',{style:{padding:'0 20px'}},
      ce('h2',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:800,marginBottom:2,letterSpacing:.4}},selected),
      ce('p',{style:{color:C.textDim,fontSize:13,marginBottom:20}},hist.length+' session'+(hist.length!==1?'s':'')+' logged'),

      // Top stats — color-coded chips
      ce('div',{style:{display:'flex',gap:10,marginBottom:22}},
        topStats.map(function(row){
          var k=row[0],v=row[1],hue=row[2];
          return ce('div',{key:k,className:'chip-glow',style:{
            '--glow': hue+'40',
            flex:1,
            background:chipBg(hue),
            border:'1px solid '+hue+'2e',
            borderRadius:12,
            padding:'13px 14px'
          }},
            ce('div',{style:{color:C.muted,fontSize:9,textTransform:'uppercase',letterSpacing:1,marginBottom:5,fontWeight:700}},k),
            ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:hue,letterSpacing:.3,lineHeight:1}},String(v)));
        })),

      // Chart card
      ce('div',{style:{background:'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',border:'1px solid '+C.border,borderRadius:14,padding:'16px 8px 12px',marginBottom:22}},
        ce('div',{style:{display:'flex',gap:6,paddingLeft:8,marginBottom:14}},
          ['maxWeight','volume'].map(function(m){
            var active=metric===m;
            return ce('button',{key:m,className:'pill-btn',onClick:function(){setMetric(m);},
              style:{
                background:active?'linear-gradient(135deg,'+C.red+','+C.orange+')':C.surface3,
                color:active?'#fff':C.textDim,
                border:'none',borderRadius:8,padding:'7px 14px',cursor:'pointer',fontSize:11,fontWeight:700,letterSpacing:.4,
                boxShadow:active?'0 4px 12px -4px '+C.orange:'none'
              }},
              m==='maxWeight'?'MAX WEIGHT':'VOLUME');
          })),
        (function(){
          var vals=chartData.map(function(d){return d.value;});
          var W=3;
          var trend=chartData.map(function(d,i){
            var start=Math.max(0,i-W+1);
            var slice=vals.slice(start,i+1);
            var avg=Math.round(slice.reduce(function(s,v){return s+v;},0)/slice.length);
            return {name:d.name,value:avg};
          });
          return ce(LineChart,{data:chartData,trend:trend});
        })()),

      ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1.4,marginBottom:10,fontWeight:700}},'Session History'),
      hist.slice().reverse().map(function(h,i){
        return ce('div',{key:i,style:{background:'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',border:'1px solid '+C.border,borderRadius:12,padding:'14px 16px',marginBottom:8}},
          ce('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:8}},
            ce('span',{style:{fontWeight:600,fontSize:13.5}},h.label),
            ce('span',{style:{color:C.orange,fontWeight:800,fontSize:15,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:.3}},h.maxWeight>0?h.maxWeight+' KG':'BW')),
          ce('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
            h.sets.map(function(set,si){
              return ce('span',{key:si,style:{background:C.surface3,borderRadius:6,padding:'4px 10px',fontSize:11.5,color:C.textDim,fontWeight:500}},
                set.reps+'×'+(set.weight>0?set.weight:'BW'));
            })));
      })));
  }

  if(showPBs) return ce(AllTimePBs,{workouts:workouts,onClose:function(){setShowPBs(false);}});

  // Empty state — distinguish network failure from genuinely no data
  if(!workouts.length) {
    // Network failed and localStorage was empty — data likely exists in cloud
    if(networkFailed) return ce('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60vh',gap:16,padding:20,textAlign:'center',animation:'fadeIn .3s ease'}},
      ce('div',{style:{fontSize:52,filter:'drop-shadow(0 4px 24px rgba(255,90,73,.3))'}},'⚠️'),
      ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:800,color:C.text,letterSpacing:.5}},'CONNECTION FAILED'),
      ce('div',{style:{fontSize:14,color:C.textDim,maxWidth:280,lineHeight:1.5}},"Couldn’t reach the server. Your data is safe — tap retry to try again."),
      ce('button',{className:'pill-btn',onClick:function(){props.onRetry&&props.onRetry();},style:{
        background:'linear-gradient(135deg,'+C.red+','+C.orange+')',color:'#fff',
        border:'none',borderRadius:12,padding:'13px 30px',cursor:'pointer',
        fontSize:14,fontWeight:700,marginTop:4,
        boxShadow:'0 8px 20px -8px '+C.orange,letterSpacing:.4
      }},'Retry Connection'),
      ce('div',{style:{fontSize:12,color:C.muted,marginTop:4}},'Check your connection and try again'));
    // Genuinely no workouts yet
    return ce('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60vh',gap:16,color:C.muted,padding:20,textAlign:'center'}},
      ce('div',{style:{fontSize:56,filter:'drop-shadow(0 4px 24px rgba(255,90,73,.3))'}},'🏋️'),
      ce('div',{style:{fontSize:20,fontWeight:700,color:C.text,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:.5}},'NO WORKOUTS YET'),
      ce('div',{style:{fontSize:14,maxWidth:260,color:C.textDim}},'Add your first session to start tracking progressive overload'),
      ce('button',{className:'pill-btn',onClick:function(){setShowAdd(true);},style:{background:'linear-gradient(135deg,'+C.red+','+C.orange+')',color:'#fff',border:'none',borderRadius:12,padding:'12px 28px',cursor:'pointer',fontSize:14,fontWeight:700,marginTop:8,boxShadow:'0 8px 20px -8px '+C.orange,letterSpacing:.4}},'+ ADD FIRST WORKOUT'),
      showAdd?ce(AddModal,mProps):null);
  }

  // ── Dashboard ─────────────────────────────────────────────
  var totalLbs=workouts.reduce(function(s,w){return s+wVol(w);},0);
  var pbsCount =prsThisWeek(workouts);            // lifetime PRs broken in last 7 days
  var hitCount =hitsThisWeek(workouts);           // distinct exercises this week
  var volCount =volThisWeek(workouts);            // total kg lifted this week
  var weeks    =weeklyHistory(workouts,12);
  var volData=workouts.map(function(w){return{label:w.label,volume:wVol(w)};});

  function toggleRing(key){ setExpandedRing(function(prev){ return prev===key?null:key; }); }

  return ce('div',{style:{padding:20}},
    // ── Hero: Triple-ring (PBs / Muscles Hit / Volume)
    ce('div',{style:{
      position:'relative',
      background:'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',
      border:'1px solid '+C.border,
      borderRadius:18,
      padding:'20px 18px',
      marginBottom:14,
      boxShadow:'inset 0 1px 0 rgba(255,255,255,.04)'
    }},
      ce(TripleRing,{pbs:pbsCount,hit:hitCount,vol:volCount,goals:goals,activeKey:expandedRing,onToggle:toggleRing})),

    // ── 12-week history rings (collapsed until a ring is tapped)
    expandedRing ? ce(HistoryRings,{weeks:weeks,goals:goals,activeKey:expandedRing,onClose:function(){setExpandedRing(null);},workouts:workouts}) : null,

    // ── Lifted total (full-width chip) + Add button
    ce('div',{style:{display:'flex',gap:10,marginBottom:20}},
      ce('div',{className:'chip-glow',style:{
        '--glow': C.green+'30',
        flex:1,
        background: chipBg(C.green),
        border: '1px solid '+C.green+'2e',
        borderRadius: 14,
        padding: '12px 16px',
        display:'flex',
        alignItems:'center',
        justifyContent:'space-between'
      }},
        ce('div',null,
          ce('div',{style:{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:1,fontWeight:700,marginBottom:3}},'Total Lifted'),
          ce('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:800,color:C.green,letterSpacing:.3,lineHeight:1}},
            (totalLbs/1000).toFixed(1),ce('span',{style:{fontSize:14,color:C.muted,marginLeft:3,fontWeight:600}},'k kg'))),
        ce('div',{style:{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:1,fontWeight:700,textAlign:'right'}},
          workouts.length+' sessions',ce('br'),'all time')),
      ce('button',{className:'pill-btn',onClick:function(){setShowAdd(true);},style:{
        background:'linear-gradient(135deg,'+C.red+','+C.orange+')',
        color:'#fff',border:'none',borderRadius:14,
        padding:'0 18px',cursor:'pointer',fontSize:13,fontWeight:800,letterSpacing:.5,
        boxShadow:'0 6px 16px -6px '+C.orange,minWidth:64
      }},'+ ADD')),

    // ── Volume chart card
    ce('div',{style:{
      background:'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',
      border:'1px solid '+C.border,
      borderRadius:sessionIdx!==null?'14px 14px 0 0':14,
      padding:'18px 10px 12px'
    }},
      ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 10px',marginBottom:14}},
        ce('div',null,
          ce('div',{style:{fontSize:9,color:C.muted,textTransform:'uppercase',letterSpacing:1.4,fontWeight:700}},'Session Volume'),
          ce('div',{style:{fontSize:11,color:C.textDim,marginTop:2}},'Kilograms moved per session')),
        ce('div',{style:{fontSize:10,color:sessionIdx!==null?C.cyan:C.muted,fontWeight:600}},
          sessionIdx!==null?'Tap again to close':'Tap a bar')),
      ce(BarChart,{data:volData,selectedIdx:sessionIdx,onSelect:setSessionIdx})),

    sessionIdx!==null
      ?ce('div',{style:{
        background:'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',
        border:'1px solid '+C.border,
        borderTop:'none',
        borderRadius:'0 0 14px 14px',
        padding:'0 14px 14px',
        marginBottom:18
      }},ce(SessionDetail,{workout:workouts[sessionIdx],onDelete:handleDelete}))
      :ce('div',{style:{marginBottom:18}}),

    // Trend stats
    ce(TrendStats,{workouts:workouts}),

    // Exercise grid header + PBs button
    ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
      ce('div',null,
        ce('div',{style:{fontSize:10,color:C.muted,textTransform:'uppercase',letterSpacing:1.4,fontWeight:700}},'Exercises'),
        ce('div',{style:{fontSize:11,color:C.textDim,marginTop:2}},'Tap to view progression')),
      ce('button',{className:'pill-btn',onClick:function(){setShowPBs(true);},
        style:{
          background:chipBg(C.orange),
          border:'1px solid '+C.orange+'40',
          color:C.orange,borderRadius:10,
          padding:'7px 13px',cursor:'pointer',fontSize:11.5,fontWeight:700,
          display:'flex',alignItems:'center',gap:5,letterSpacing:.3
        }},
        '🏆 ALL-TIME PBs')),

    // Exercise grid with PR badges — each card colored by delta status
    ce('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,paddingBottom:20}},
      allNames.map(function(name){
        var delta=getDelta(name),hist=getHist(name),latest=hist[hist.length-1],pr=isPR(name);
        var hue = pr?C.orange : delta===null?C.muted : delta>0?C.green : delta<0?'#f87171' : C.cyan;

        return ce('div',{key:name,className:'ex-card chip-glow',onClick:function(){setSelected(name);},
          onMouseOver:function(e){e.currentTarget.style.borderColor=hue+'70';},
          onMouseOut:function(e){e.currentTarget.style.borderColor=pr?C.orange+'40':C.border;},
          style:{
            '--glow': pr?C.orange+'50':'transparent',
            background: pr ? chipBg(C.orange) : 'linear-gradient(160deg,'+C.surface2+' 0%,'+C.surface+' 100%)',
            borderRadius:12,
            padding:'13px 14px',
            cursor:'pointer',
            border:'1px solid '+(pr?C.orange+'40':C.border),
            position:'relative',
            transition:'border-color .15s, transform .15s'
          }},
          pr?ce('span',{style:{position:'absolute',top:8,right:10,fontSize:14,filter:'drop-shadow(0 0 6px '+C.orange+')'}},'🏆'):null,
          ce('div',{style:{fontSize:12,fontWeight:600,marginBottom:9,lineHeight:1.3,paddingRight:pr?20:0,color:C.text}},name),
          ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline'}},
            ce('span',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:800,color:hue,letterSpacing:.3,lineHeight:1}},
              latest.maxWeight>0?latest.maxWeight:'BW',
              latest.maxWeight>0?ce('span',{style:{fontSize:10,color:C.muted,marginLeft:3,fontWeight:600}},'kg'):null),
            ce('span',{style:{fontSize:10.5,fontWeight:700,color:hue,letterSpacing:.3,textTransform:'uppercase'}},
              pr?'NEW PR':delta===null?'1st':delta>0?'▲ '+delta:delta<0?'▼ '+Math.abs(delta):'= same')));
      })),

    showAdd?ce(AddModal,mProps):null,
    showSettings?ce(SettingsSheet,{goals:goals,onSave:function(ng){setGoals(ng);},onClose:function(){setShowSettings(false);}}):null);
}

// ── App ───────────────────────────────────────────────────
function App() {
  var s1=useState('idle'),     syncStatus=s1[0],   setSyncStatus=s1[1];
  var s1b=useState(0),         retryKey=s1b[0],    setRetryKey=s1b[1];
  function handleRetry(){ setSyncStatus('loading'); setRetryKey(function(k){return k+1;}); }
  var s2=useState(function(){
    var c=localStorage.getItem('workout-auth-charlie')==='true';
    var j=localStorage.getItem('workout-auth-john')==='true';
    return (c&&!j)?'charlie':(j&&!c)?'john':null;
  }), picked=s2[0], setPicked=s2[1];
  var s3=useState(function(){
    var c=localStorage.getItem('workout-auth-charlie')==='true';
    var j=localStorage.getItem('workout-auth-john')==='true';
    return (c&&!j)?'charlie':(j&&!c)?'john':'charlie';
  }), tab=s3[0], setTab=s3[1];
  var s4=useState(function(){
    return {john:localStorage.getItem('workout-auth-john')==='true',charlie:localStorage.getItem('workout-auth-charlie')==='true'};
  }), auth=s4[0], setAuth=s4[1];
  var s5=useState(null), pinTarget=s5[0], setPinTarget=s5[1];

  var isLoading=syncStatus==='loading';

  function pickUser(person){ setPicked(person);setTab(person);if(!auth[person]) setPinTarget(person); }
  function switchTab(newTab){
    if(isLoading) return;
    setTab(newTab);if(!auth[newTab]) setPinTarget(newTab);
  }
  function unlock(person){ setAuth(function(prev){return Object.assign({},prev,{[person]:true});}); setPinTarget(null); }
  function changeUser(){ setPicked(null); setPinTarget(null); }

  if(picked===null) return ce(UserPicker,{onPick:pickUser});
  if(pinTarget) return ce(PinModal,{person:pinTarget,onSuccess:function(){unlock(pinTarget);},onBack:function(){setPicked(null);setPinTarget(null);}});

  return ce('div',{style:{minHeight:'100vh',color:C.text,maxWidth:620,margin:'0 auto'}},
    // Sticky header
    ce('div',{style:{
      padding:'18px 20px 0',
      background:'linear-gradient(180deg,rgba(11,15,30,.92) 0%,rgba(11,15,30,.78) 100%)',
      backdropFilter:'blur(12px)',
      WebkitBackdropFilter:'blur(12px)',
      borderBottom:'1px solid '+C.border,
      position:'sticky',top:0,zIndex:10
    }},
      ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}},
        ce('h1',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,letterSpacing:1.2}},
          'WORKOUT ',ce('span',{style:{background:'linear-gradient(135deg,'+C.red+','+C.orange+')',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}},'TRACKER')),
        ce('div',{style:{display:'flex',alignItems:'center',gap:8}},
          ce(SyncBadge,{status:syncStatus,onRetry:syncStatus==='error'?handleRetry:null}),
          auth[tab]?ce('button',{
            onClick:function(){window.dispatchEvent(new CustomEvent('wt-open-settings'));},
            title:'Edit weekly goals',
            style:{background:C.surface3,border:'1px solid '+C.border,color:C.textDim,borderRadius:8,padding:'6px 10px',cursor:'pointer',fontSize:14,fontWeight:600,letterSpacing:.3,lineHeight:1}
          },'⚙'):null,
          ce('button',{onClick:changeUser,style:{background:C.surface3,border:'1px solid '+C.border,color:C.textDim,borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:11.5,fontWeight:600,whiteSpace:'nowrap',letterSpacing:.3}},'LOGOUT'))),
      // Tabs
      ce('div',{style:{display:'flex',gap:6}},
        [['john','John',C.violet],['charlie','Charlie',C.pink]].map(function(pair){
          var id=pair[0],label=pair[1],hue=pair[2],isActive=tab===id;
          return ce('button',{key:id,
            onClick:function(){switchTab(id);},
            disabled:isLoading&&!isActive,
            style:{
              background:isActive?'linear-gradient(135deg,'+hue+','+hue+'cc)':'transparent',
              color:isActive?'#fff':isLoading?C.border:C.textDim,
              border:'none',borderRadius:'10px 10px 0 0',padding:'10px 22px',
              cursor:isLoading&&!isActive?'not-allowed':'pointer',
              fontSize:13,fontWeight:700,letterSpacing:.6,
              display:'flex',alignItems:'center',gap:6,
              opacity:isLoading&&!isActive?0.4:1,
              transition:'opacity .2s, background .2s',
              boxShadow:isActive?'0 -2px 16px -4px '+hue:'none'
            }},
            label.toUpperCase(),
            !auth[id]?ce('span',{style:{fontSize:11}},'🔒'):null);
        }))),

    // Tab content
    auth[tab]
      ?ce(WorkoutTracker,{key:tab,person:tab,onSync:setSyncStatus,retryKey:retryKey,onRetry:handleRetry})
      :ce('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60vh',gap:12,color:C.muted}},
          ce('span',{style:{fontSize:34}},'🔒'),
          ce('span',{style:{fontSize:14}},'Tap the tab above to unlock')));
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App,null));
</script>
</body>
</html>
