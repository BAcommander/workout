// ── Helpers ───────────────────────────────────────────────
const wVol    = w  => w.exercises.reduce((s,ex)=>s+ex.sets.reduce((s2,set)=>s2+set.reps*set.weight,0),0);
const exMax   = ex => { const ws=ex.sets.map(s=>s.weight).filter(w=>w>0); return ws.length?Math.max(...ws):0; };
const exVol   = ex => ex.sets.reduce((s,set)=>s+set.reps*set.weight,0);
const cleanBin= raw=> Array.isArray(raw)?raw.filter(x=>x&&typeof x==="object"&&x.date&&Array.isArray(x.exercises)):[];

function autoLabel(ds) {
  const d = new Date(ds+"T12:00:00");
  return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${d.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}`;
}

function parseWorkoutText(text) {
  const exercises=[], blocks=text.split(/Exercise:\s*Optional\s*\(\s*"/);
  for(let i=1;i<blocks.length;i++){
    const block=blocks[i], nameEnd=block.indexOf('"');
    if(nameEnd===-1) continue;
    const name=block.substring(0,nameEnd).trim(), sets=[];
    for(const m of block.matchAll(/- (\d+)\s+reps\s+x\s+([\d.]+)/g))
      sets.push({reps:parseInt(m[1]),weight:parseFloat(m[2])});
    if(sets.length&&name) exercises.push({name,sets});
  }
  return exercises;
}

// ── JSONBin ───────────────────────────────────────────────
const binUrl = p=>`https://api.jsonbin.io/v3/b/${BINS[p]}`;
const bHdrs  = {'X-Access-Key': API_KEY};

async function fetchBin(p) {
  const r = await fetch(binUrl(p), {headers: bHdrs});
  if (!r.ok) throw new Error();
  return (await r.json()).record;
}
async function saveBin(p, data) {
  const r = await fetch(binUrl(p), {method:'PUT', headers:{...bHdrs,'Content-Type':'application/json'}, body:JSON.stringify(data)});
  if (!r.ok) throw new Error();
}

// ── Charts ────────────────────────────────────────────────
function BarChart({data}) {
  if(!data.length) return null;
  const max=Math.max(...data.map(d=>d.volume),1);
  const vW=420,H=110,pL=48,pB=22,pT=10,pR=8,plotW=vW-pL-pR,plotH=H-pB-pT;
  const step=plotW/data.length,barW=Math.min(38,step*0.55);
  return html`<svg viewBox="0 0 ${vW} ${H}" style="width:100%;height:${H}px">
    ${[0,Math.round(max*.5),max].map(v=>{const y=pT+plotH-(v/max)*plotH;return html`
      <line key=${"l"+v} x1=${pL} y1=${y} x2=${vW-pR} y2=${y} stroke=${C.border} stroke-width="0.5"/>
      <text key=${"t"+v} x=${pL-5} y=${y+4} text-anchor="end" fill=${C.muted} font-size="9">${v>999?Math.round(v/1000)+"k":v}</text>`;
    })}
    ${data.map((d,i)=>{const x=pL+i*step+step/2-barW/2,bH=(d.volume/max)*plotH,y=pT+plotH-bH;return html`
      <rect key=${i} x=${x} y=${y} width=${barW} height=${bH} fill=${C.accent} rx="3">
        <title>${d.label}: ${d.volume.toLocaleString()} lbs</title></rect>
      <text key=${"lb"+i} x=${x+barW/2} y=${H-4} text-anchor="middle" fill=${C.muted} font-size="10">${d.label}</text>`;
    })}
  </svg>`;
}

function LineChart({data}) {
  if(data.length<2) return html`<div style="text-align:center;padding:36px 0;color:${C.muted};font-size:13px">Add more workouts to see a trend</div>`;
  const vals=data.map(d=>d.value),max=Math.max(...vals),min=Math.min(...vals),range=max-min||1;
  const vW=420,H=180,pL=48,pB=24,pT=16,pR=16,plotW=vW-pL-pR,plotH=H-pB-pT,step=plotW/(data.length-1);
  const pts=data.map((d,i)=>({x:pL+i*step,y:pT+plotH-((d.value-min)/range)*plotH,...d}));
  const pD=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const aD=`${pD} L ${pts[pts.length-1].x} ${pT+plotH} L ${pL} ${pT+plotH} Z`;
  return html`<svg viewBox="0 0 ${vW} ${H}" style="width:100%;height:${H}px">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color=${C.accent} stop-opacity="0.25"/>
      <stop offset="100%" stop-color=${C.accent} stop-opacity="0"/>
    </linearGradient></defs>
    ${[min,Math.round((min+max)/2),max].map(v=>{const y=pT+plotH-((v-min)/range)*plotH;return html`
      <line key=${"gl"+v} x1=${pL} y1=${y} x2=${vW-pR} y2=${y} stroke=${C.border} stroke-width="0.5"/>
      <text key=${"gt"+v} x=${pL-5} y=${y+4} text-anchor="end" fill=${C.muted} font-size="9">${v}</text>`;
    })}
    <path d=${aD} fill="url(#lg)"/>
    <path d=${pD} fill="none" stroke=${C.accent} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>html`
      <circle key=${i} cx=${p.x} cy=${p.y} r="5" fill=${C.accent}><title>${p.name}: ${p.value}</title></circle>
      <text key=${"tl"+i} x=${p.x} y=${H-4} text-anchor="middle" fill=${C.muted} font-size="10">${p.name}</text>`)}
  </svg>`;
}

  const spin = status==="loading"||status==="saving";

    ${label}

}

// ── WorkoutTracker ────────────────────────────────────────
function WorkoutTracker({person, onSync}) {
  const [workouts,   setWorkouts]   = useState(null);
  const [selected,   setSelected]   = useState(null);
  const [metric,     setMetric]     = useState("maxWeight");
  const [showAdd,    setShowAdd]    = useState(false);
  const [addDate,    setAddDate]    = useState("");
  const [addLabel,   setAddLabel]   = useState("");
  const [addText,    setAddText]    = useState("");
  const [addError,   setAddError]   = useState("");
  const [addOk,      setAddOk]      = useState(false);
  const skipSave = useRef(true);

  useEffect(()=>{
    onSync("loading");
    (async()=>{
      try {
        const raw   = await fetchBin(person);
        const clean = cleanBin(raw);
        const seed  = person==="charlie"?CHARLIE_SEED:[];
        const data  = clean.length>0?clean:seed;
        skipSave.current=true;
        setWorkouts(data);
        onSync("idle");
        if (clean.length===0&&seed.length>0) await saveBin(person,seed);
      } catch {
        try {
          const s=localStorage.getItem(`wt-${person}`);
          setWorkouts(s?JSON.parse(s):(person==="charlie"?CHARLIE_SEED:[]));
        } catch { setWorkouts(person==="charlie"?CHARLIE_SEED:[]); }
        onSync("error");
      }
    })();
  },[person]);

  useEffect(()=>{
    if (workouts===null) return;
    if (skipSave.current) { skipSave.current=false; return; }
    try { localStorage.setItem(`wt-${person}`,JSON.stringify(workouts)); } catch {}
    onSync("saving");
    saveBin(person,workouts)
      .then(()=>{ onSync("saved"); setTimeout(()=>onSync("idle"),2500); })
      .catch(()=>onSync("error"));
  },[workouts]);

  const allNames = workouts?[...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.name)))].sort():[];
  const getHist  = name=>(workouts||[]).filter(w=>w.exercises.some(e=>e.name===name)).map(w=>{
    const ex=w.exercises.find(e=>e.name===name);
    return{label:w.label,maxWeight:exMax(ex),volume:exVol(ex),sets:ex.sets};
  });
  const getDelta = name=>{const h=getHist(name);return h.length<2?null:h[h.length-1].maxWeight-h[h.length-2].maxWeight;};
  const closeAdd = ()=>{setShowAdd(false);setAddError("");setAddOk(false);};
  const handleAdd= ()=>{
    setAddError("");setAddOk(false);
    if(!addDate||!addText.trim()){setAddError("Date and workout text are required.");return;}
    if(workouts.some(w=>w.date===addDate)){setAddError("A workout already exists for this date.");return;}
    const exercises=parseWorkoutText(addText);
    if(!exercises.length){setAddError("No exercises found — check the format matches your app export.");return;}
    const nw={id:`w-${addDate}`,date:addDate,label:addLabel||autoLabel(addDate),exercises};
    setWorkouts(prev=>[...prev,nw].sort((a,b)=>a.date.localeCompare(b.date)));
    setAddOk(true);
    setTimeout(()=>{closeAdd();setAddDate("");setAddLabel("");setAddText("");setAddOk(false);},900);
  };
  const mProps={addDate,setAddDate,addLabel,setAddLabel,addText,setAddText,addError,addOk,handleAdd,onClose:closeAdd};

  if (workouts===null) return html`
    <div style="display:flex;align-items:center;justify-content:center;height:60vh;color:${C.muted};gap:10px;font-size:14px">
      <span style="display:inline-block;width:18px;height:18px;border:2px solid ${C.accent};border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite"/>
      Loading from cloud…
    </div>`;

  if (selected) {
    const hist=getHist(selected);
    const chartData=hist.map(h=>({name:h.label,value:metric==="maxWeight"?h.maxWeight:h.volume}));
    const best=Math.max(...hist.map(h=>h.maxWeight));
    const totalReps=hist.reduce((s,h)=>s+h.sets.reduce((s2,set)=>s2+set.reps,0),0);
    return html`
      <div style="padding:20px">
        <button onClick=${()=>setSelected(null)} style="background:none;border:none;color:${C.muted};cursor:pointer;font-size:14px;margin-bottom:18px;padding:0">← Back</button>
        <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;margin-bottom:2px">${selected}</h2>
        <p style="color:${C.muted};font-size:13px;margin-bottom:20px">${hist.length} session${hist.length!==1?"s":""} logged</p>
        <div style="display:flex;gap:10px;margin-bottom:20px">
          ${[["Best",best>0?`${best} lbs`:"BW"],["Sessions",hist.length],["Total Reps",totalReps]].map(([k,v])=>html`
            <div key=${k} style="flex:1;background:${C.card};border-radius:10px;padding:12px 14px">
              <div style="color:${C.muted};font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">${k}</div>
              <div style="font-size:20px;font-weight:700;color:${C.accent}">${v}</div>
            </div>`)}
        </div>
        <div style="background:${C.card};border-radius:12px;padding:16px 8px 12px;margin-bottom:20px">
          <div style="display:flex;gap:8px;padding-left:8px;margin-bottom:14px">
            ${["maxWeight","volume"].map(m=>html`
              <button key=${m} onClick=${()=>setMetric(m)}
                style="background:${metric===m?C.accent:C.card2};color:${metric===m?"#fff":C.muted};border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700">
                ${m==="maxWeight"?"Max Weight":"Volume"}
              </button>`)}
          </div>
          <${LineChart} data=${chartData}/>
        </div>
        <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Session History</div>
        ${[...hist].reverse().map((h,i)=>html`
          <div key=${i} style="background:${C.card};border-radius:10px;padding:14px 16px;margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-weight:600;font-size:14px">${h.label}</span>
              <span style="color:${C.accent};font-weight:700;font-size:14px">${h.maxWeight>0?`${h.maxWeight} lbs`:"BW"}</span>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${h.sets.map((s,si)=>html`
                <span key=${si} style="background:${C.card2};border-radius:6px;padding:4px 10px;font-size:12px;color:${C.muted}">
                  ${s.reps}×${s.weight>0?s.weight:"BW"}
                </span>`)}
            </div>
          </div>`)}
      </div>`;
  }

  const totalLbs=workouts.reduce((s,w)=>s+wVol(w),0);
  const volData=workouts.map(w=>({label:w.label,volume:wVol(w)}));

  if (!workouts.length) return html`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:${C.muted};padding:20px;text-align:center">
      <div style="font-size:52px">🏋️</div>
      <div style="font-size:20px;font-weight:700;color:${C.text}">No workouts yet</div>
      <div style="font-size:14px;max-width:260px">Add your first session to start tracking progressive overload</div>
      <button onClick=${()=>setShowAdd(true)} style="background:${C.accent};color:#fff;border:none;border-radius:10px;padding:12px 24px;cursor:pointer;font-size:14px;font-weight:700;margin-top:8px">
        + Add First Workout
      </button>
      ${showAdd&&html`<${AddModal} ...${mProps}/>`}
    </div>`;

  return html`
    <div style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px">
        <div style="display:flex;gap:20px">
          ${[["Sessions",workouts.length],["Exercises",allNames.length],["Lifted",`${(totalLbs/1000).toFixed(1)}k lbs`]].map(([k,v])=>html`
            <div key=${k}>
              <div style="font-size:20px;font-weight:700">${v}</div>
              <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:.5px">${k}</div>
            </div>`)}
        </div>
        <button onClick=${()=>setShowAdd(true)} style="background:${C.accent};color:#fff;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700">+ Add</button>
      </div>
      <div style="background:${C.card};border-radius:12px;padding:16px 8px 10px;margin-bottom:24px">
        <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:1px;padding-left:8px;margin-bottom:12px">Session Volume (lbs)</div>
        <${BarChart} data=${volData}/>
      </div>
      <div style="font-size:10px;color:${C.muted};text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Exercises — tap to view progression</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:20px">
        ${allNames.map(name=>{
          const delta=getDelta(name),hist=getHist(name),latest=hist[hist.length-1];
          const bCol=delta===null?C.border:delta>0?C.teal:delta<0?"#f87171":C.border;
          return html`
            <div key=${name} class="ex-card" onClick=${()=>setSelected(name)}
              style="background:${C.card};border-radius:10px;padding:13px 14px;cursor:pointer;border-left:3px solid ${bCol}">
              <div style="font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.3">${name}</div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:17px;font-weight:700;color:${delta>0?C.teal:C.text}">${latest.maxWeight>0?`${latest.maxWeight} lbs`:"BW"}</span>
                <span style="font-size:12px;font-weight:600;color:${delta>0?C.teal:delta<0?"#f87171":C.muted}">
                  ${delta===null?"1 session":delta>0?`▲ ${delta}`:delta<0?`▼ ${Math.abs(delta)}`:"= same"}
                </span>
              </div>
            </div>`;
        })}
      </div>
      ${showAdd&&html`<${AddModal} ...${mProps}/>`}
    </div>`;
}

// ── App shell ─────────────────────────────────────────────
function App() {
  const [tab,      setTab]      = useState("charlie");
  const [syncStatus,setSyncStatus] = useState("idle");
  const [auth,     setAuth]     = useState(()=>({
    john:    localStorage.getItem("workout-auth-john")==="true",
    charlie: localStorage.getItem("workout-auth-charlie")==="true"
  }));
  const [pinTarget,setPinTarget] = useState(()=>
    localStorage.getItem("workout-auth-charlie")!=="true"?"charlie":null
  );

  const switchTab = newTab => {
    setTab(newTab);
    if (!auth[newTab]) setPinTarget(newTab);
  };

  const unlock = person => {
    setAuth(prev=>({...prev,[person]:true}));
    setPinTarget(null);
  };

  const lock = person => {
    localStorage.removeItem(`workout-auth-${person}`);
    setAuth(prev=>({...prev,[person]:false}));
    setPinTarget(person);
  };

  return html`
    <div style="background:${C.bg};min-height:100vh;color:${C.text};max-width:620px;margin:0 auto">

      ${pinTarget&&html`<${PinModal} person=${pinTarget} onSuccess=${()=>unlock(pinTarget)}/>`}

      <div style="padding:18px 20px 0;background:linear-gradient(160deg,#161c2d 0%,#0d1117 100%);border-bottom:1px solid ${C.border};position:sticky;top:0;z-index:10">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:1px">
            WORKOUT <span style="color:${C.accent}">TRACKER</span>
          </h1>
          <div style="display:flex;align-items:center;gap:10px">
            <${SyncBadge} status=${syncStatus}/>
            <button onClick=${()=>lock(tab)} title="Lock this account"
              style="background:${C.card2};border:1px solid ${C.border};color:${C.muted};border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px">
              🔒 Lock
            </button>
          </div>
        </div>
        <div style="display:flex;gap:4px">
          ${[["john","John"],["charlie","Charlie"]].map(([id,label])=>html`
            <button key=${id} onClick=${()=>switchTab(id)}
              style="background:${tab===id?C.accent:"transparent"};color:${tab===id?"#fff":C.muted};border:none;border-radius:8px 8px 0 0;padding:9px 22px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px">
              ${label}${!auth[id]?html`<span style="font-size:11px">🔒</span>`:""}
            </button>`)}
        </div>
      </div>

      ${auth[tab]
        ? html`<${WorkoutTracker} key=${tab} person=${tab} onSync=${setSyncStatus}/>`
        : html`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;color:${C.muted}">
            <span style="font-size:32px">🔒</span>
            <span style="font-size:14px">Tap the tab above to unlock</span>
          </div>`
      }
    </div>`;
}

render(h(App,null), document.getElementById('root'));
</script>
</body>
</html>
